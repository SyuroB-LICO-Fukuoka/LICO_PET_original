<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カート・ご注文手続き｜ITTENMON</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shop.css?v=1017a">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="img/app/shop-180.png">
<link rel="icon" href="img/app/shop-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ITTENMON">
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="page-title"><span class="en">CART</span><h1>ご注文手続き</h1></div>
  <div id="root"></div>
</main>
<div id="site-footer"></div>

<script src="js/config.js?v=1017a"></script>
<script src="js/common.js?v=1018c"></script>
<script src="js/chatbot.js?v=1017a" defer></script>
<script>
(() => {
  const {S, yen, esc, isCafe, cafeId, getCart, setCart, subtotal, shipping, api, toast, chrome, qs, product, unitPrice, optionText} = window.LICO;
  chrome();
  const cafe = isCafe();
  const f = { pay: cafe ? "cash" : "card", name:"", kana:"", email:"", tel:"", delivery: cafe ? "pickup" : "ship", zip:"", address:"", note:"", agree:false, coupon:"", couponMsg:"" };
  // クーポン：いちばん高い商品1個分が0円になる（本当に使えるかは注文のときにサーバーで確かめる）
  const couponOff = () => f.coupon ? Math.max(0, ...getCart().map(i => unitPrice(i))) : 0;
  const $ = s => document.querySelector(s);
  if(qs.get("added")) setTimeout(()=>toast("カートに入れました"),100);

  function render(){
    const cart = getCart();
    if(!cart.length){
      $("#root").innerHTML = `<div class="empty-cart"><p>カートは空です。</p><a class="btn" href="product.html">商品を見る</a></div>`;
      return;
    }
    const sub = subtotal(), ship = shipping(f.delivery), off = couponOff(), total = Math.max(0, sub + ship - off), free = total === 0;
    $("#root").innerHTML = `
    ${qs.get("canceled")?`<p class="alert" style="margin-bottom:20px">お支払いが完了していません。内容をご確認のうえ、もう一度お手続きください。</p>`:""}
    <div class="cart-grid">
      <section>
        ${cart.map(i=>`<div class="ci">
          ${i.thumb?`<img src="${i.thumb}" alt="選んだ写真">`:`<div class="noimg">写真<br>なし</div>`}
          <div>
            <div class="name">${esc(product(i.productId||"phone").name)}</div>
            <dl>${product(i.productId||"phone").optionLabel?`<dt>${esc(product(i.productId||"phone").optionLabel)}</dt><dd>${esc(optionText(i))}</dd>`:""}
              <dt>写真</dt><dd>${i.fileId&&i.designFileId?"デザイン作成済み":"未送信（削除して作り直してください）"}</dd>
              <dt>文字</dt><dd>${i.text?`${esc(i.text)}（${esc(i.font)}・${esc(i.color)}）`:"なし"}</dd></dl>
            <div class="row">
              <div class="qty"><button type="button" data-dec="${i.key}" aria-label="1つ減らす">−</button><output>${i.qty}</output><button type="button" data-inc="${i.key}" aria-label="1つ増やす">＋</button></div>
              <span class="amt">${yen(unitPrice(i)*i.qty)}</span>
              <button class="rm" type="button" data-rm="${i.key}">削除</button>
            </div>
          </div>
        </div>`).join("")}
        <p style="margin-top:16px"><a href="product.html" style="text-decoration:underline;font-size:14px">＋ 別の写真・別の商品でもうひとつ作る</a></p>
      </section>

      <form class="box" id="frm" novalidate>
        <h2>お客様の情報</h2>
        ${cafe?`<div class="fld"><span class="lbl">お支払い方法</span><div class="seg">
          <button type="button" data-pay="cash" aria-pressed="${f.pay==="cash"}">現金</button>
          <button type="button" data-pay="card" aria-pressed="${f.pay==="card"}">クレジットカード</button></div></div>
          <p class="info">${f.pay==="cash"?"お代金はカフェのレジでお支払いください。お支払いの確認後に製作を始めます。":"次の画面でカード情報を入力してお支払いください。お支払いが済むと製作を始めます。"}</p>`:""}
        <div class="grid2">
          <div class="fld"><label for="c-name">お名前<span class="req">必須</span></label><input type="text" id="c-name" autocomplete="name" value="${esc(f.name)}"></div>
          <div class="fld"><label for="c-kana">フリガナ<span class="req">必須</span></label><input type="text" id="c-kana" value="${esc(f.kana)}"></div>
        </div>
        <div class="grid2">
          <div class="fld"><label for="c-tel">電話番号<span class="req">必須</span></label><input type="tel" id="c-tel" autocomplete="tel" inputmode="tel" value="${esc(f.tel)}"></div>
          <div class="fld"><label for="c-email">メールアドレス${cafe?`<span class="opt">任意</span>`:`<span class="req">必須</span>`}</label><input type="email" id="c-email" autocomplete="email" value="${esc(f.email)}"></div>
        </div>
        ${cafe?"":`<div class="fld"><span class="lbl">受け取り方法</span><div class="seg">
          <button type="button" data-dl="ship" aria-pressed="${f.delivery==="ship"}">配送</button>
          <button type="button" data-dl="pickup" aria-pressed="${f.delivery==="pickup"}">店頭で受け取る</button></div></div>`}
        ${f.delivery==="ship"?`<div class="grid2">
          <div class="fld"><label for="c-zip">郵便番号<span class="req">必須</span></label><input type="text" id="c-zip" inputmode="numeric" autocomplete="postal-code" placeholder="819-0161" value="${esc(f.zip)}"></div>
          <div class="fld" style="grid-column:1/-1"><label for="c-addr">住所<span class="req">必須</span></label><input type="text" id="c-addr" autocomplete="street-address" value="${esc(f.address)}"></div>
        </div>`:(cafe?`<p class="info">受け取り場所：${esc(window.LICO.cafeName())}（ご注文いただいたカフェ）。できあがり次第ご連絡します。</p>`:`<p class="info">受け取り場所：店頭（福岡市西区今宿東1丁目19-14）。できあがり次第ご連絡します。</p>`)}
        <div class="fld"><label for="c-note">ご要望など<span class="opt">任意</span></label><textarea id="c-note" rows="3">${esc(f.note)}</textarea></div>
        <div class="fld"><label for="c-coupon">クーポンコード<span class="opt">お持ちの方</span></label>
          <div style="display:flex;gap:8px">${f.coupon?`<input type="text" id="c-coupon" value="${esc(f.coupon)}" disabled style="flex:1"><button type="button" class="btn btn-line" data-uncoupon="1" style="padding:8px 14px">取り消す</button>`:`<input type="text" id="c-coupon" autocomplete="off" placeholder="ITTEN-XXXXXX" style="flex:1;text-transform:uppercase"><button type="button" class="btn btn-line" data-coupon="1" style="padding:8px 14px">使う</button>`}</div>
          ${f.couponMsg?`<p class="info" style="margin-top:6px">${esc(f.couponMsg)}</p>`:""}</div>
        <div class="totals">
          <div><span>商品小計（${cart.reduce((a,i)=>a+i.qty,0)}個）</span><span>${yen(sub)}</span></div>
          ${off?`<div><span>クーポン（商品1個分）</span><span>−${yen(off)}</span></div>`:""}
          <div><span>送料</span><span>${ship?yen(ship):"無料"}</span></div>
          <div class="grand"><span>合計（税込）</span><span>${yen(total)}</span></div>
        </div>
        <label class="check"><input type="checkbox" id="c-agree" ${f.agree?"checked":""}> <span><a href="tokushoho.html" target="_blank" style="text-decoration:underline">特定商取引法に基づく表記</a>と<a href="tokushoho.html#privacy" target="_blank" style="text-decoration:underline">プライバシーポリシー</a>に同意します</span></label>
        <div id="msg"></div>
        <button class="btn btn-block" type="submit" id="go">${goLabel(free)}</button>
        ${free||(cafe&&f.pay==="cash")?"":`<p class="p-note" style="text-align:center">次の画面で、お支払い方法を選んで安全にお支払いいただけます（Stripe）。</p>`}
      </form>
    </div>`;
  }

  const goLabel = free => free ? "この内容で注文する（0円）" : (cafe&&f.pay==="cash" ? "この内容で受け付ける" : "お支払いへ進む");
  // 日本語入力のまま打った全角の英数字・記号（＠ ． ０-９ ー など）を半角にそろえる
  const half = s => String(s||"").replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[ー－―‐−]/g, "-").replace(/[\s\u3000]/g, "");
  function pull(){
    const v = id => { const el=document.getElementById(id); return el ? el.value.trim() : ""; };
    f.name=v("c-name"); f.kana=v("c-kana"); f.tel=half(v("c-tel")); f.email=half(v("c-email")); f.note=document.getElementById("c-note")?.value||"";
    if(document.getElementById("c-zip")){ f.zip=v("c-zip"); f.address=v("c-addr"); }
    f.agree=!!document.getElementById("c-agree")?.checked;
  }

  document.addEventListener("click", e=>{
    const t = e.target.closest("button"); if(!t) return;
    const cart = getCart();
    const it = k => cart.find(i=>i.key===k);
    if(t.dataset.inc){ pull(); const i=it(t.dataset.inc); if(i && i.qty<20){ i.qty++; setCart(cart); render(); } }
    if(t.dataset.dec){ pull(); const i=it(t.dataset.dec); if(i && i.qty>1){ i.qty--; setCart(cart); render(); } }
    if(t.dataset.rm){ pull(); setCart(cart.filter(i=>i.key!==t.dataset.rm)); render(); }
    if(t.dataset.dl){ pull(); f.delivery=t.dataset.dl; render(); }
    if(t.dataset.pay){ pull(); f.pay=t.dataset.pay; render(); }
    if(t.dataset.uncoupon){ pull(); f.coupon=""; f.couponMsg=""; render(); }
    if(t.dataset.coupon){
      pull(); const code = (document.getElementById("c-coupon")?.value||"").trim();
      if(!code){ f.couponMsg="クーポンコードを入れてください。"; render(); return; }
      t.disabled = true; t.textContent = "確認中…";
      api({action:"checkCoupon", code}).then(r=>{ f.coupon=r.code; f.couponMsg="クーポンを使えます。商品1個分が0円になります。"; render(); })
        .catch(err=>{ f.coupon=""; f.couponMsg=err.message; render(); });
    }
  });

  function problems(){
    const errs = [];
    if(!f.name) errs.push("お名前");
    if(!f.kana) errs.push("フリガナ");
    if(!/^[0-9-]{10,14}$/.test(f.tel)) errs.push("電話番号（数字で）");
    if((!cafe || f.email) && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) errs.push(cafe ? "メールアドレス（正しい形で。なしでも大丈夫です）" : "メールアドレス");
    if(f.delivery==="ship" && (!f.zip || !f.address)) errs.push("郵便番号と住所");
    if(!f.agree) errs.push("同意のチェック");
    return errs;
  }
  // エラーが出ているときは、入力するたびに見直して、直ったものから消す
  const recheck = e => {
    if(!e.target.closest || !e.target.closest("#frm") || !$("#msg .alert")) return;
    pull(); const errs = problems();
    $("#msg").innerHTML = errs.length ? `<p class="alert">入力してください：${errs.join("、")}</p>` : "";
  };
  document.addEventListener("input", recheck); document.addEventListener("change", recheck);
  // 欄を離れたら全角を半角に直して見せる
  document.addEventListener("focusout", e => { if(e.target.id==="c-email" || e.target.id==="c-tel") e.target.value = half(e.target.value); });

  document.addEventListener("submit", async e=>{
    if(e.target.id!=="frm") return;
    e.preventDefault(); pull();
    const errs = problems();
    if(errs.length){ $("#msg").innerHTML=`<p class="alert">入力してください：${errs.join("、")}</p>`; return; }
    const go = $("#go"); go.disabled = true; go.textContent = "送信しています…";
    try{
      const cart = getCart();
      const r = await api({ action:"createOrder", mode: cafe?"cafe":"online", cafeId: cafeId(),
        items: cart.map(i=>({productId:i.productId||"phone", variant:i.variant||"", model:optionText(i)||product(i.productId||"phone").short, fileId:i.fileId, fileIds:i.fileIds||[i.fileId], designFileId:i.designFileId, previewFileId:i.previewFileId||"", text:i.text, font:i.font, color:i.color, qty:i.qty})),
        customer: {name:f.name, kana:f.kana, tel:f.tel, email:f.email, zip:f.zip, address:f.address, note:f.note},
        delivery: f.delivery, payMethod: f.pay, coupon: f.coupon });
      if(r.checkoutUrl){ location.href = r.checkoutUrl; return; }
      setCart([]);
      location.href = "complete.html?order=" + encodeURIComponent(r.orderNo) + (r.free ? "&free=1" : "");
    }catch(err){
      $("#msg").innerHTML = `<p class="alert">${esc(err.message)}</p>`;
      go.disabled = false; go.textContent = goLabel(Math.max(0, subtotal() + shipping(f.delivery) - couponOff()) === 0);
    }
  });

  render();
})();
</script>
</body>
</html>
