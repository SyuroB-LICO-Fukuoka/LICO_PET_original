<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ご注文ありがとうございました｜ITTENMON</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shop.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="page-title"><span class="en">THANK YOU</span><h1 id="ttl">ご注文を確認しています</h1></div>
  <div class="done-box" id="box"><div class="spinner" aria-label="確認中"></div></div>
</main>
<div id="site-footer"></div>
<script src="js/config.js?v=1015e"></script>
<script src="js/common.js?v=1015e"></script>
<script src="js/chatbot.js?v=1015e" defer></script>
<script>
(async () => {
  const {S, esc, isCafe, setCart, api, chrome, qs} = window.LICO;
  chrome();
  const order = qs.get("order") || "", sid = qs.get("session_id") || "";
  const box = document.getElementById("box"), ttl = document.getElementById("ttl");
  const line = `<p>ご不明な点は、注文番号を添えてLINE（${esc(S.LINE_ID)}）でお問い合わせください。</p>`;

  if(isCafe() && !sid){   // カフェの現金受付（カード払いは下で確認する）
    setCart([]);
    ttl.textContent = "受け付けました";
    box.innerHTML = `<p>注文番号</p><p class="no">${esc(order)}</p>
      <p>お代金（現金）はカフェでお受け取りください。カフェから毎週まとめてLICOへお振込みいただき、確認してから製作を始めます。</p>${line}
      <a class="btn" href="product.html">次のお客様の受付へ</a>`;
    return;
  }
  try{
    const r = await api({action:"confirmPayment", orderNo: order, sessionId: sid});
    setCart([]);
    ttl.textContent = "ご注文ありがとうございました";
    box.innerHTML = `<p>注文番号</p><p class="no">${esc(r.orderNo)}</p>
      <p>${r.paid ? "お支払いを確認しました。確認メールをお送りしています。" : "お支払いの確認に少し時間がかかっています。確認ができしだいメールでお知らせします。"}</p>
      ${line}${isCafe()?`<a class="btn" href="product.html">次のお客様の受付へ</a>`:`<a class="btn" href="index.html">トップへ戻る</a>`}`;
  }catch(err){
    ttl.textContent = "ご注文の確認";
    box.innerHTML = `<p class="alert">${esc(err.message)}</p><p>お支払いが済んでいる場合は、確認メールをお待ちください。ご不明な点はLINEでお問い合わせください。</p><a class="btn btn-line" href="${esc(S.LINE_URL)}" target="_blank" rel="noopener">LINEで問い合わせる</a>`;
  }
})();
</script>
</body>
</html>
