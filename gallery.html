<style>
.g-hero{background:var(--bg-sub);padding-block:56px 44px;text-align:center;overflow:hidden;position:relative}
.g-hero .en{font-size:12px;color:var(--accent);display:block}
.g-hero h1{font-family:"Shippori Mincho",serif;font-weight:600;font-size:clamp(26px,5vw,42px);line-height:1.5;margin:10px 0 14px;letter-spacing:.08em}
.g-hero p{color:#555;max-width:560px;margin:0 auto;font-size:14px}
.g-count{display:inline-flex;gap:22px;margin-top:22px;font-size:12px;color:var(--sub)}
.g-count b{font-family:var(--f-en);font-size:22px;color:var(--text);font-weight:500;display:block;line-height:1.2}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:22px 16px 6px;justify-content:flex-start;max-width:var(--max);margin:0 auto}
.filters::-webkit-scrollbar{display:none}
@media(min-width:768px){.filters{justify-content:center;padding-inline:32px}}
.filters button{flex-shrink:0;border:1px solid var(--line);background:#fff;padding:8px 16px;font-size:13px;cursor:pointer;letter-spacing:.06em;border-radius:999px}
.filters button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}
.filters .n{font-family:var(--f-en);margin-left:6px;opacity:.7}
.masonry{columns:2 160px;column-gap:12px;padding-block:20px 40px}
@media(min-width:768px){.masonry{columns:3 240px;column-gap:20px}}
.work{break-inside:avoid;margin-bottom:12px;display:block;width:100%;border:0;padding:0;background:none;text-align:left;cursor:pointer;color:inherit}
@media(min-width:768px){.work{margin-bottom:20px}}
.work .ph{position:relative;overflow:hidden;background:var(--img)}
.work img{width:100%;height:auto;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.work:hover img{transform:scale(1.04)}
.work .ov{position:absolute;inset:auto 0 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:12px;opacity:0;transition:.3s}
.work:hover .ov,.work:focus-visible .ov{opacity:1}
.work .cap{padding:8px 2px 0;display:flex;flex-direction:column;gap:1px}
.work .cap .s{font-family:var(--f-en);font-size:10.5px;letter-spacing:.14em;color:var(--accent)}
.work .cap .t{font-size:13.5px;font-weight:500;line-height:1.6}
.work .tag{display:inline-block;font-size:10.5px;border:1px solid var(--line);padding:0 7px;margin-right:4px;color:var(--sub)}
.next{break-inside:avoid;margin-bottom:12px;background:var(--text);color:#fff;padding:28px 20px;display:flex;flex-direction:column;gap:12px;text-decoration:none}
.next .en{font-size:11px;color:var(--accent)}
.next h2{font-family:"Shippori Mincho",serif;font-size:20px;line-height:1.6;font-weight:600}
@media(max-width:600px){.next{padding:20px 14px}.next h2{font-size:16px}.next p{font-size:12px}}
.next p{font-size:13px;color:#ccc}
.next .go{border-bottom:1px solid #fff;align-self:flex-start;font-size:13px;padding-bottom:2px}
.voice{background:var(--bg-sub);padding-block:56px}
.voice-in{display:grid;gap:24px;align-items:center}
@media(min-width:768px){.voice-in{grid-template-columns:1fr 1fr;gap:56px}}
.voice h2{font-family:"Shippori Mincho",serif;font-size:22px;line-height:1.7;font-weight:600}
.voice ul{list-style:none;display:flex;flex-direction:column;gap:10px;font-size:14px;color:#555}
.voice li::before{content:"—";color:var(--accent);margin-right:8px}
/* 拡大表示 */
.lb{position:fixed;inset:0;z-index:150;background:rgba(20,20,20,.92);display:flex;align-items:center;justify-content:center;padding:16px}
.lb-box{background:#fff;width:min(980px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:grid}
@media(min-width:800px){.lb-box{grid-template-columns:1.2fr 1fr}}
.lb-img{background:#111;display:flex;align-items:center;justify-content:center}
.lb-img img{max-height:72dvh;width:auto;max-width:100%}
.lb-info{padding:24px 22px;display:flex;flex-direction:column;gap:12px}
.lb-info .s{font-family:var(--f-en);font-size:11px;letter-spacing:.14em;color:var(--accent)}
.lb-info h2{font-size:19px;line-height:1.6}
.lb-info p{font-size:14px;color:#555}
.lb-info .meta{font-size:12px;color:var(--sub)}
.lb-x,.lb-nav{position:fixed;border:0;background:rgba(255,255,255,.14);color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center}
.lb-x{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px}
.lb-nav{top:50%;transform:translateY(-50%)}.lb-prev{left:8px}.lb-next{right:8px}
@media(max-width:799px){.lb-nav{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:none}}
@media(prefers-reduced-motion:reduce){.work img{transition:none}}
</style>

<body>
<div id="site-header"></div>

<section class="g-hero">
  <span class="en">GALLERY</span>
  <h1>写真から生まれた、<br>世界にひとつの作品たち。</h1>
  <p>うちの子、家族、愛車、思い出の景色。<br>LICOのメンバーが一点ずつ仕上げた作品をご紹介します。</p>
  <div class="g-count" id="count"></div>
</section>

<div class="filters" id="filters" role="toolbar" aria-label="商品でしぼりこむ"></div>
<div class="wrap"><div class="masonry" id="grid"></div></div>

<section class="voice">
  <div class="wrap voice-in">
    <div>
      <span class="en" style="font-size:12px;color:var(--accent)">FOR YOU</span>
      <h2>次に並ぶのは、<br>あなたの一枚かもしれません。</h2>
    </div>
    <ul>
      <li>スマホの写真を選ぶだけ。その場で位置や大きさを決められます</li>
      <li>写真は3枚まで、文字やスタンプも入れられます</li>
      <li>仕上がった作品は、ご了承いただいたものだけをここでご紹介します</li>
    </ul>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/config.js?v=1017a"></script>
<script src="js/common.js?v=1018d"></script>
<script src="js/gallery.js?v=1017a"></script>
<script src="js/chatbot.js?v=1017a" defer></script>
<script>
(function(){
  const {S, esc, chrome, product} = window.LICO;
  chrome();
  const ALL = (window.ITTENMON_GALLERY || []).slice().sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")));
  const pname = id => (S.PRODUCTS.find(p => p.id === id) || {}).short || "";
  const pseries = id => (S.PRODUCTS.find(p => p.id === id) || {}).series || "";
  let filter = new URLSearchParams(location.search).get("item") || "";
  let shown = [];

  const cats = S.PRODUCTS.map(p => [p.id, p.short, ALL.filter(w => w.product === p.id).length]).filter(c => c[2]);
  document.getElementById("count").innerHTML = `<span><b>${ALL.length}</b>作品</span><span><b>${cats.length}</b>アイテム</span>`;

  function renderFilters(){
    document.getElementById("filters").innerHTML = [["", "すべて", ALL.length]].concat(cats)
      .map(([id, l, n]) => `<button type="button" data-f="${id}" aria-pressed="${filter === id}">${esc(l)}<span class="n">${n}</span></button>`).join("");
  }
  function renderGrid(){
    shown = ALL.filter(w => !filter || w.product === filter);
    const cards = shown.map((w, i) => `<button type="button" class="work" data-i="${i}">
        <div class="ph"><img src="${esc(w.img)}" alt="${esc(w.title)}" loading="${i < 4 ? "eager" : "lazy"}"><span class="ov">くわしく見る</span></div>
        <div class="cap"><span class="s">${esc(pseries(w.product))}</span><span class="t">${esc(w.title)}</span>
        <span>${(w.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</span></div></button>`);
    const target = filter ? `product.html?id=${encodeURIComponent(filter)}` : "product.html";
    cards.splice(Math.min(cards.length, 5), 0, `<a class="next" href="${target}"><span class="en">MAKE YOURS</span><h2>あなたの写真で、<br>つくってみませんか。</h2><p>スマホから写真を選んで、その場でデザインできます。</p><span class="go">${filter ? esc(pname(filter)) + "をつくる" : "商品を見る"} →</span></a>`);
    document.getElementById("grid").innerHTML = cards.join("");
  }
  function open(i){
    const w = shown[i]; if(!w) return;
    close();
    const lb = document.createElement("div"); lb.className = "lb"; lb.id = "lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-label", w.title);
    lb.innerHTML = `<div class="lb-box"><div class="lb-img"><img src="${esc(w.img)}" alt="${esc(w.title)}"></div>
      <div class="lb-info"><span class="s">${esc(pseries(w.product))}</span><h2>${esc(w.title)}</h2>
      ${w.comment ? `<p>${esc(w.comment)}</p>` : ""}
      <span class="meta">${esc(pname(w.product))}${w.date ? "｜" + esc(String(w.date).replace("-", "年")) + "月" : ""}</span>
      <a class="btn" href="product.html?id=${encodeURIComponent(w.product)}">この商品でつくる</a></div></div>
      <button class="lb-x" type="button" aria-label="閉じる">×</button>
      ${shown.length > 1 ? `<button class="lb-nav lb-prev" type="button" aria-label="前の作品">‹</button><button class="lb-nav lb-next" type="button" aria-label="次の作品">›</button>` : ""}`;
    lb.onclick = e => {
      if(e.target === lb || e.target.classList.contains("lb-x")) close();
      else if(e.target.classList.contains("lb-prev")) open((i - 1 + shown.length) % shown.length);
      else if(e.target.classList.contains("lb-next")) open((i + 1) % shown.length);
    };
    document.body.appendChild(lb); document.body.style.overflow = "hidden";
    lb.querySelector(".lb-x").focus();
    open.cur = i;
  }
  function close(){ const lb = document.getElementById("lb"); if(lb){ lb.remove(); document.body.style.overflow = ""; } }
  document.addEventListener("keydown", e => {
    if(!document.getElementById("lb")) return;
    if(e.key === "Escape") close();
    if(e.key === "ArrowRight" && shown.length > 1) open((open.cur + 1) % shown.length);
    if(e.key === "ArrowLeft" && shown.length > 1) open((open.cur - 1 + shown.length) % shown.length);
  });
  document.addEventListener("click", e => {
    const f = e.target.closest("[data-f]"); if(f){ filter = f.dataset.f; renderFilters(); renderGrid(); history.replaceState(null, "", filter ? "?item=" + filter : location.pathname); return; }
    const w = e.target.closest(".work"); if(w) open(+w.dataset.i);
  });
  renderFilters(); renderGrid();
})();
</script>
</body>
