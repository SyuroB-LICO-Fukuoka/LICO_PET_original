<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>写真でつくるオリジナルiPhoneケース｜LICO PET original</title>
<meta name="description" content="お気に入りの写真でつくる、世界にひとつのiPhoneケース。機種を選んで写真をアップロードし、画面の上で位置や大きさ、文字を決めて注文できます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shop.css">
<style>
.p-main-img img{width:100%;height:100%;object-fit:cover}
.points{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.points li{display:flex;gap:10px}
.points li::before{content:"✓";color:var(--accent);font-weight:700}
.big-btn{display:block;width:100%;text-align:center;background:#2aa4c9;color:#fff;font-size:20px;padding:18px;border:0;cursor:pointer;letter-spacing:.08em}
.big-btn:hover{filter:brightness(1.05)}
.flow3{display:grid;gap:12px;counter-reset:f}
@media(min-width:700px){.flow3{grid-template-columns:repeat(3,1fr)}}
.flow3 div{border:1px solid var(--line);padding:16px;font-size:14px}
.flow3 b{display:block;font-family:var(--f-en);color:var(--accent);font-size:12px;letter-spacing:.14em}
/* 機種・数量の選択 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.sheet{background:#fff;width:min(1000px,100%);padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.sheet-h h2{font-size:17px}
.sheet-h button{background:none;border:0;font-size:28px;cursor:pointer;line-height:1}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.models button{background:#fff;border:1px solid transparent;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;line-height:1.3}
.models button:hover{border-color:var(--line)}
.models button[aria-pressed="true"]{border-color:var(--text);background:#f7f6f3}
.models svg{width:34px;height:60px}
.qtab{width:100%;border-collapse:collapse;font-size:14px}
.qtab th{background:#555;color:#fff;font-weight:500;padding:8px}
.qtab td{border:1px solid var(--line);padding:10px;text-align:center}
.qtab input{width:80px;padding:8px;border:1px solid #d6d3cc;text-align:center;font-size:15px}
.qsum{display:flex;justify-content:flex-end;gap:24px;font-size:15px}
.qsum b{font-family:var(--f-en);font-size:20px}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="p-head">
    <p class="series en">PHOTO CASE SERIES</p>
    <h1 id="pName"></h1>
    <p class="price" id="pPrice"></p>
  </div>
  <div class="p-main">
    <div class="p-media"><div class="p-main-img"><img src="img/sample-work.jpg" alt="写真をプリントしたケースの見本"></div></div>
    <div class="p-info">
      <p class="p-lead" id="pLead"></p>
      <ul class="points">
        <li>1個から注文できます（数量を変えると金額が自動で変わります）</li>
        <li>画面の上で、写真の位置・大きさ・向きを自由に決められます</li>
        <li>お名前やメッセージを入れられます（書体13種類・色100色以上）</li>
        <li>できあがりイメージを確認してから注文できます</li>
      </ul>
      <button class="big-btn" type="button" id="startBtn">デザインする</button>
      <p class="ship-note" id="shipNote"></p>
      <div class="flow3">
        <div><b>STEP 1</b>機種と数量を選ぶ</div>
        <div><b>STEP 2</b>写真をアップロードして、位置や文字を決める</div>
        <div><b>STEP 3</b>できあがりを確認してカートへ</div>
      </div>
    </div>
  </div>
  <section class="faq" id="faq"><h2>FAQ</h2><div id="faqList"></div></section>
</main>
<div id="site-footer"></div>
<div id="sheetHost"></div>

<script src="js/config.js?v=1013a"></script>
<script src="js/common.js?v=1013a"></script>
<script>
(() => {
  const {S, yen, esc, chrome} = window.LICO;
  const P = S.PRODUCT;
  chrome();
  const $ = s => document.querySelector(s);
  $("#pName").textContent = P.name;
  $("#pPrice").innerHTML = `${yen(P.price)}<small>（税込）</small>`;
  $("#pLead").textContent = P.lead;
  $("#shipNote").textContent = P.shipNote;
  $("#faqList").innerHTML = P.faq.map(f => `<details><summary>Q. ${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("");

  // 機種アイコン（ケースの外形とカメラ）
  const icon = big => `<svg viewBox="0 0 34 60" fill="none" stroke="#333" stroke-width="1.3"><rect x="2" y="2" width="30" height="56" rx="${big ? 6 : 5}"/><rect x="5" y="5" width="${big ? 13 : 10}" height="${big ? 13 : 11}" rx="3"/></svg>`;
  let model = "", qty = 1;
  function open(){
    $("#sheetHost").innerHTML = `<div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-label="機種と数量の選択">
      <div class="sheet-h"><h2>機種・数量の選択</h2><button type="button" id="close" aria-label="閉じる">×</button></div>
      <p class="help" style="font-size:13px;color:var(--sub)">お使いのiPhoneの機種を選んでください。</p>
      <div class="models" id="models">${P.models.map(m => `<button type="button" data-m="${esc(m)}" aria-pressed="${m === model}">${icon(/Pro|Max|Plus|Air/.test(m))}${esc(m)}</button>`).join("")}</div>
      <table class="qtab"><thead><tr><th>機種</th><th>数量</th><th>単価（税込）</th><th>小計（税込）</th></tr></thead>
        <tbody><tr><td id="qm">${esc(model) || "—"}</td><td><input type="number" id="q" min="1" max="20" value="${qty}" aria-label="数量"></td><td>${yen(P.price)}</td><td id="qs">${yen(P.price * qty)}</td></tr></tbody></table>
      <div class="qsum"><span>合計（税込）</span><b id="qt">${yen(P.price * qty)}</b></div>
      <button class="big-btn" type="button" id="toDesign">デザインする</button>
      <p class="help" style="font-size:12px;color:var(--sub);text-align:center">ほかの機種もほしいときは、カートに入れたあと「別の写真でもうひとつ作る」から追加できます。</p>
    </div></div>`;
    const upd = () => { $("#qm").textContent = model || "—"; $("#qs").textContent = yen(P.price * qty); $("#qt").textContent = yen(P.price * qty); };
    $("#models").onclick = e => { const b = e.target.closest("button"); if(!b) return; model = b.dataset.m; document.querySelectorAll("#models button").forEach(x => x.setAttribute("aria-pressed", x === b)); upd(); };
    $("#q").oninput = e => { qty = Math.max(1, Math.min(20, parseInt(e.target.value) || 1)); upd(); };
    $("#close").onclick = () => $("#sheetHost").innerHTML = "";
    $("#bg").onclick = e => { if(e.target.id === "bg") $("#sheetHost").innerHTML = ""; };
    $("#toDesign").onclick = () => {
      if(!model){ window.LICO.toast("機種を選んでください"); return; }
      location.href = `design.html?model=${encodeURIComponent(model)}&qty=${qty}`;
    };
  }
  $("#startBtn").onclick = open;
})();
</script>
</body>
</html>
