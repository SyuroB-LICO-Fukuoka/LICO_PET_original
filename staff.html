<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ITTENMON Partner</title>
<link rel="manifest" href="staff.webmanifest">
<meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8">
<link rel="apple-touch-icon" href="img/app/staff-180.png">
<link rel="icon" href="img/app/staff-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ITTENMON">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* ============================================================
   ITTENMON Partner — 本部（LICO）と加盟店（カフェ）の受注管理アプリ
   デザイン：8pxグリッド／角丸12・16／影は2段階／ライト・ダーク対応
   ============================================================ */
:root{
  --bg:#f5f6f8; --bg-2:#eceef2; --surface:#fff; --surface-2:#fafbfc; --line:#e3e6eb; --line-2:#d3d8df;
  --fg:#0f1720; --fg-2:#3a4552; --sub:#6b7684; --faint:#98a2ae;
  --brand:#0e7c6b; --brand-2:#0a6b5c; --brand-soft:#e2f3ef; --brand-ink:#075447;
  --blue:#2563eb; --blue-soft:#e6eefc; --amber:#b45309; --amber-soft:#fdf1df; --red:#c62828; --red-soft:#fdecec; --violet:#6d28d9; --violet-soft:#f0eafd;
  --sh-1:0 1px 2px rgba(15,23,32,.06),0 1px 1px rgba(15,23,32,.04); --sh-2:0 8px 28px rgba(15,23,32,.12),0 2px 6px rgba(15,23,32,.06);
  --r-s:8px; --r:12px; --r-l:16px; --r-xl:22px;
  --f:"Inter","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --tab-h:58px; --side-w:248px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0b1016; --bg-2:#121922; --surface:#141c26; --surface-2:#18212c; --line:#232e3b; --line-2:#2f3b49;
  --fg:#eef2f6; --fg-2:#c6ced8; --sub:#8f9aa7; --faint:#66717e;
  --brand:#2bb39c; --brand-2:#38c4ac; --brand-soft:#0f2e29; --brand-ink:#7fe0cd;
  --blue:#6b9cff; --blue-soft:#14233f; --amber:#f0a543; --amber-soft:#33240f; --red:#ff6b6b; --red-soft:#3a1717; --violet:#a98bff; --violet-soft:#241a3f;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 12px 32px rgba(0,0,0,.5);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brand);text-decoration:none}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
svg{flex-shrink:0}

/* ---------- レイアウト ---------- */
.app{min-height:100dvh}
.side{display:none}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 10px) 16px 10px;max-width:1180px;margin:0 auto}
.top-title{flex:1;min-width:0}
.top-title .eyebrow{font-size:12px;color:var(--sub);font-weight:500;display:flex;align-items:center;gap:6px}
.top-title h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{max-width:1180px;margin:0 auto;padding:8px 16px calc(var(--tab-h) + var(--safe-b) + 28px);display:flex;flex-direction:column;gap:20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(var(--n),1fr);padding-bottom:var(--safe-b)}
.tabbar button{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:10.5px;font-weight:600;position:relative}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--brand)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.tabbar .badge{position:absolute;top:6px;left:calc(50% + 5px);border:2px solid var(--surface)}
.badge[data-n="0"]{display:none}
@media (min-width:1024px){
  .app{display:grid;grid-template-columns:var(--side-w) 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .tabbar{display:none}
  .content{padding-bottom:48px}
  .top-in{padding-top:18px}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#16a38b);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;box-shadow:var(--sh-1)}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand small{display:block;font-size:11.5px;color:var(--sub)}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--fg-2);font-weight:600;font-size:14.5px;width:100%;text-align:left}
.nav-btn svg{width:20px;height:20px;color:var(--faint)}
.nav-btn:hover{background:var(--bg)}
.nav-btn[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink)}
.nav-btn[aria-current="page"] svg{color:var(--brand)}
.nav-btn .badge{margin-left:auto}
.side-foot{margin-top:auto;padding:12px;border-radius:var(--r);background:var(--bg);font-size:12.5px;color:var(--sub);display:flex;flex-direction:column;gap:8px}
.side-foot .who{display:flex;align-items:center;gap:10px;color:var(--fg);font-weight:600;font-size:13.5px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}

/* ---------- 部品 ---------- */
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--fg-2);box-shadow:var(--sh-1)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;background:var(--surface);border:1px solid var(--line-2);color:var(--fg);white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-2)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn-danger{color:var(--red)}
.btn-block{width:100%}
.btn-lg{height:52px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.card-pad{padding:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 2px 10px}
.sec-h h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.005em}
.sec-h .link{font-size:13.5px;font-weight:600}
.muted{color:var(--sub)}
.small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bg-2);color:var(--fg-2)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pill.brand{background:var(--brand-soft);color:var(--brand-ink)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.violet{background:var(--violet-soft);color:var(--violet)}
.pill.dark{background:var(--fg);color:var(--surface)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.seg::-webkit-scrollbar{display:none}
.seg button{height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--fg-2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.seg button .c{font-size:12px;color:var(--faint);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--surface)}
.seg button[aria-pressed="true"] .c{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--sub)}
.input,.select,.textarea{width:100%;height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.textarea{height:auto;padding:12px 14px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.search .input{padding-left:42px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:36px 20px;color:var(--sub)}
.empty svg{width:56px;height:56px;color:var(--line-2)}
.empty b{color:var(--fg-2);font-size:15px}
.skel{background:linear-gradient(90deg,var(--bg-2) 25%,var(--surface-2) 50%,var(--bg-2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- ダッシュボード ---------- */
.hero{border-radius:var(--r-xl);padding:20px;background:linear-gradient(135deg,#0b5f52 0%,#0e7c6b 55%,#17a088 100%);color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh-2)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .k{font-size:13px;opacity:.85;font-weight:500}
.hero .v{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.hero .row{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;opacity:.92}
.hero .row b{font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left}
.kpi .k{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .k svg{width:16px;height:16px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .v small{font-size:13px;color:var(--sub);font-weight:600;margin-left:3px}
.kpi.alert .v{color:var(--red)}
.kpi.warn .v{color:var(--amber)}
.pipe{display:flex;flex-direction:column;gap:12px}
.pipe-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--bg-2);gap:2px}
.pipe-bar i{display:block;height:100%}
.pipe-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px}
.pipe-legend button{display:flex;align-items:center;gap:8px;font-size:13.5px;text-align:left;color:var(--fg-2);padding:4px 0}
.pipe-legend button i{width:10px;height:10px;border-radius:3px}
.pipe-legend button b{margin-left:auto;font-variant-numeric:tabular-nums}
.two{display:grid;gap:20px}
@media (min-width:1024px){.two{grid-template-columns:1.35fr 1fr}}
.two>*,.content>*,.main{min-width:0}
html,body{overflow-x:hidden}

/* ---------- 注文リスト ---------- */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.thumb{width:52px;height:52px;border-radius:12px;background:var(--bg-2);object-fit:cover;flex-shrink:0;border:1px solid var(--line)}
.thumb.ph{display:grid;place-items:center;color:var(--faint)}
.thumb.ph svg{width:22px;height:22px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.row-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.row-r .amt{font-weight:700;font-size:14.5px}
.chev{width:16px;height:16px;color:var(--faint)}

/* ---------- 製造ボード ---------- */
.board{display:grid;gap:14px;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x mandatory}
.col{scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:0 4px}
.col-h i{width:9px;height:9px;border-radius:50%}
.col-h .c{margin-left:auto;color:var(--sub);font-weight:600;font-size:13px}
.col-body{display:flex;flex-direction:column;gap:10px;background:var(--bg-2);border-radius:var(--r-l);padding:10px;min-height:120px}
.job{padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left}
.job-h{display:flex;gap:10px;align-items:flex-start}
.job-h .row-main{gap:2px}
.job .acts{display:flex;gap:8px}
.job .acts .btn{height:38px;font-size:13.5px;padding:0 12px;flex:1}
.flags{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- 店舗 ---------- */
.stores{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.store{padding:16px;display:flex;flex-direction:column;gap:14px;text-align:left}
.store-h{display:flex;align-items:center;gap:12px}
.store-logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px;flex-shrink:0}
.store-h b{font-size:16px;display:block}
.store-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.store-stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.store-stats span{display:block;font-size:11.5px;color:var(--sub);font-weight:600}
.store-stats b{font-size:16px}

/* ---------- 詳細シート ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,14,20,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:var(--sh-2);animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:760px){.scrim{align-items:center;padding:24px}.sheet{border-radius:22px;max-height:88dvh}}
.sheet-grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 0}
@media (min-width:760px){.sheet-grab{display:none}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:17px;flex:1;min-width:0}
.sheet-b{overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.sheet-b>*{flex-shrink:0}
.sheet-f{padding:12px 20px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-f .btn{flex:1}
.close{width:34px;height:34px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;color:var(--sub)}
.close svg{width:18px;height:18px}
.steps{display:flex;align-items:flex-start;gap:0;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.steps::-webkit-scrollbar{display:none}
.step{flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11px;color:var(--faint);font-weight:600;text-align:center}
.step::before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step .dot{width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);display:grid;place-items:center;z-index:1}
.step .dot svg{width:13px;height:13px}
.step.done{color:var(--fg-2)} .step.done::before{background:var(--brand)}
.step.done .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.step.now{color:var(--brand-ink)} .step.now::before{background:var(--brand)}
.step.now .dot{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 20%,transparent)}
.step.now .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.gallery{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.gallery::-webkit-scrollbar{display:none}
.gallery a{flex:0 0 auto;width:124px;display:flex;flex-direction:column;gap:6px;color:var(--fg-2);font-size:12px;font-weight:600}
.gallery img{width:124px;height:124px;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:var(--bg-2)}
.gallery a.main img{border:2px solid var(--brand)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px 14px;font-size:14px;margin:0}
.kv dt{color:var(--sub);font-weight:600;font-size:13px}
.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.group{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.group-h{padding:10px 14px;background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--sub);border-bottom:1px solid var(--line);letter-spacing:.02em}
.group-b{padding:14px}
.contact{display:flex;gap:8px;flex-wrap:wrap}
.contact a{flex:1;min-width:120px}

/* ---------- その他・設定 ---------- */
.menu-list{display:flex;flex-direction:column}
.menu-list > *{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;color:var(--fg);font-size:15px}
.menu-list > *:last-child{border-bottom:0}
.menu-list .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.menu-list .ico svg{width:18px;height:18px}
.menu-list .t{flex:1;min-width:0}
.menu-list .t small{display:block;color:var(--sub);font-size:12.5px}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.qr-card{padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;break-inside:avoid}
.qr-card .qr{width:184px;height:184px;padding:8px;background:#fff;border-radius:12px}
.qr-card .qr img,.qr-card .qr canvas{width:168px!important;height:168px!important}
.qr-card small{color:var(--sub);font-size:11px;word-break:break-all}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(90px,1fr) 2fr auto;gap:12px;align-items:center;font-size:13.5px}
.bar{height:10px;border-radius:5px;background:var(--bg-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.spark{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;align-items:end;height:130px}
.spark div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10.5px;color:var(--faint)}
.spark b{width:100%;border-radius:5px 5px 2px 2px;background:var(--brand);min-height:2px}
.spark .v{color:var(--fg-2);font-weight:600}

/* ---------- ログイン ---------- */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--brand) 18%,transparent),transparent),var(--bg)}
.login-card{width:100%;max-width:400px;padding:28px 24px;display:flex;flex-direction:column;gap:18px}
.login-card .brand{padding:0}
.login-card h2{margin:0;font-size:22px;letter-spacing:-.01em}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{min-width:0;width:100%;height:56px;text-align:center;font-size:22px;font-weight:700;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);outline:none}
.otp input:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.err{color:var(--red);font-size:13.5px;min-height:20px}
.check{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--fg-2)}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.demo-bar{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 12px);transform:translateX(-50%);z-index:60;background:var(--violet);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;box-shadow:var(--sh-2);display:flex;gap:10px;align-items:center;white-space:nowrap}
.demo-bar a{color:#fff;text-decoration:underline}

/* ---------- トースト ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--surface);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--sh-2);display:flex;align-items:center;gap:10px;animation:up .22s ease;max-width:calc(100% - 32px)}
.toast svg{width:18px;height:18px;color:var(--brand-2)}
.toast.bad svg{color:var(--red)}
@media (min-width:1024px){.toast{bottom:28px}.demo-bar{bottom:20px}}
.busy .content{opacity:.7;transition:opacity .2s}
@media print{.side,.tabbar,.top,.content,.sheet-h,.sheet-f,.no-print{display:none!important}.scrim{position:static;background:none}.sheet{max-height:none;box-shadow:none;border:0}.sheet-b{overflow:visible}}
</style>
</head>

<script>
"use strict";
/* ============================================================
   設定・定数
   ============================================================ */
const S = window.LICO_SHOP || {};
const SHOP_FALLBACK = "https://syurob-lico-fukuoka.github.io/LICO_PET_original/";
const NL = String.fromCharCode(10);
const FLOW = ["入金待ち","製造待ち","製作中","検品・梱包","お渡し・発送待ち","完了"];
const ALL = ["決済待ち",...FLOW,"キャンセル"];
const PROD = ["製造待ち","製作中","検品・梱包"];
const ST = {   // 状態ごとの色と、お客様・カフェ向けの言い方
  "決済待ち":{c:"violet",cafe:"カード払い待ち"}, "入金待ち":{c:"amber",cafe:"お振込みが必要"}, "製造待ち":{c:"blue",cafe:"LICOで製作中"},
  "製作中":{c:"blue",cafe:"LICOで製作中"}, "検品・梱包":{c:"blue",cafe:"LICOで製作中"}, "お渡し・発送待ち":{c:"brand",cafe:"お渡しできます"},
  "完了":{c:"",cafe:"お渡し済み"}, "キャンセル":{c:"red",cafe:"キャンセル"}
};
const STC = {"決済待ち":"#8b5cf6","入金待ち":"#f59e0b","製造待ち":"#60a5fa","製作中":"#3b82f6","検品・梱包":"#1d4ed8","お渡し・発送待ち":"#10b981","完了":"#94a3b8","キャンセル":"#ef4444"};
const NEXT = {"入金待ち":"入金を確認した","製造待ち":"製作を始める","製作中":"できあがった（検品へ）","検品・梱包":"検品OK","お渡し・発送待ち":"お渡し・発送した"};
const WD = ["日","月","火","水","木","金","土"];
const STORE_COLORS = ["#0e7c6b","#2563eb","#b45309","#7c3aed","#be185d","#0891b2","#4d7c0f"];

/* ============================================================
   小さな道具
   ============================================================ */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => "¥" + (Math.round(Number(n)||0)).toLocaleString("ja-JP");
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toDate = v => v == null || v === "" ? null : (typeof v === "number" ? new Date(v) : new Date(String(v).length <= 10 ? String(v)+"T00:00:00" : v));
const md = v => { const d = toDate(v); return d && !isNaN(d) ? `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})` : "—"; };
const hm = v => { const d = toDate(v); return d ? `${d.getHours()}:${pad(d.getMinutes())}` : ""; };
const ago = v => { const d = toDate(v); if(!d) return ""; const m = Math.round((Date.now()-d)/6e4); if(m<1) return "たった今"; if(m<60) return m+"分前"; const h=Math.round(m/60); if(h<24) return h+"時間前"; const dd=Math.round(h/24); return dd<8 ? dd+"日前" : md(d); };
const dueStr = o => { const d = toDate(o["納期"]); return d && !isNaN(d) ? ymd(d) : ""; };
const daysLeft = o => { const s = dueStr(o); return s ? Math.round((new Date(s+"T00:00:00") - new Date(ymd(new Date())+"T00:00:00"))/864e5) : null; };
const isActive = o => !["完了","キャンセル","決済待ち"].includes(o["状態"]);
const isLate = o => isActive(o) && dueStr(o) && daysLeft(o) < 0;
const isSoon = o => isActive(o) && dueStr(o) && daysLeft(o) >= 0 && daysLeft(o) <= 3;
const noPhoto = o => o["写真受領"] !== "はい";
const storeOf = o => o["受付"] === "カフェ" ? (o["カフェ"] || "カフェ") : "ネットショップ";
const payLabel = o => { const p = String(o["支払い方法"]||""); if(p.includes("クーポン")) return "クーポン"; if(p.includes("現金") || (!p && o["受付"]==="カフェ")) return "店頭現金"; return o["状態"]==="決済待ち" ? "カード（未払い）" : "カード払い済み"; };
const photos = o => String(o["写真"]||"").split(NL).map((line,i)=>{ const id=(line.match(/\/d\/([^/]+)/)||[])[1]; const label=line.split(" http")[0]; return id ? {id, label: label && !label.startsWith("http") ? label : "画像"+(i+1)} : null; }).filter(Boolean);
const mainPhoto = o => { const ps = photos(o); return ps.find(p=>p.label.includes("完成イメージ")) || ps[0]; };
const thumbUrl = (id, w=200) => DEMO ? `data:image/svg+xml;utf8,${encodeURIComponent(demoArt(id))}` : `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
const store = { get(k){ try{ return localStorage.getItem(k) || sessionStorage.getItem(k) || ""; }catch(_){ return ""; } }, set(k,v,keep){ try{ (keep?localStorage:sessionStorage).setItem(k,v); }catch(_){} }, del(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(_){} } };
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  orders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M8.5 12.5h7M8.5 16.5h5"/></svg>',
  factory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>',
  store:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 5.5 4h13L20 9.5M4 9.5h16M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M5 12v8h14v-8"/><path d="M10 20v-4h4v4"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  yen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 9.5h19M6.5 14.5h4"/></svg>',
  reload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>',
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  qr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M18 18h3v3"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></svg>',
  sheet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>',
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.3 12H6.3z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>',
  device:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'
};

/* ============================================================
   状態
   ============================================================ */
const params = new URLSearchParams(location.search);
const DEMO = params.get("demo");            // ?demo=lico / ?demo=cafe … 見本データで画面を確かめる（本番の注文にはさわらない）
const KEY = "lico-pass-auto";               // 前の受注管理と同じ保存名（ログインし直さなくてよい）
const app = { pass:"", role:"", cafeId:"", cafeName:"", orders:[], payDay:5, shopUrl:S.SITE_URL||SHOP_FALLBACK, sheetUrl:"", loaded:0, view:"home", filter:"active", q:"", storeSel:"", stats:null, statsAt:0, period:"d7" };
const isLico = () => app.role === "lico";

/* ============================================================
   サーバーとのやりとり（Google Apps Script）
   ============================================================ */
async function call(fn, ...args){
  document.body.classList.add("busy"); $("#reloadBtn")?.classList.add("spin");
  try{
    if(DEMO) return await demoCall(fn, args);
    const res = await fetch(S.GAS_URL, { method:"POST", body: JSON.stringify({ action:"admin", fn, pass: app.pass, args }) });
    if(!res.ok) throw new Error("サーバーにつながりませんでした（" + res.status + "）");
    const j = await res.json();
    if(!j.ok) throw new Error(j.error || "うまくいきませんでした");
    return j.data;
  }catch(e){
    const msg = e instanceof TypeError ? "通信できませんでした。電波の良い所でもう一度お試しください" : (e.message || String(e));
    toast(msg, true); throw e;
  }finally{
    document.body.classList.remove("busy"); $("#reloadBtn")?.classList.remove("spin");
  }
}
function apply(r){
  try{ localStorage.setItem("ittenmon-staff","1"); }catch(_){}
  app.role = r.role; app.cafeId = r.cafeId || ""; app.cafeName = r.cafeName || ""; app.orders = r.orders || [];
  app.payDay = r.payDay ?? 5; app.shopUrl = r.shopUrl || app.shopUrl; app.sheetUrl = r.sheetUrl || ""; app.loaded = Date.now();
  render();
}
const reload = () => call("adminList").then(apply).catch(()=>{});

/* ============================================================
   画面の骨組み
   ============================================================ */
function tabs(){
  return isLico()
    ? [["home","ホーム",I.home],["orders","注文",I.orders],["factory","製造",I.factory],["stores","店舗",I.store],["more","その他",I.more]]
    : [["home","ホーム",I.home],["orders","注文",I.orders],["pay","お振込み",I.yen],["more","その他",I.more]];
}
const TITLES = { home:"ホーム", orders:"注文", factory:"製造", stores:"店舗", pay:"お振込み", more:"その他", stats:"アクセス分析", qr:"QRコード" };
function shell(){
  const t = tabs();
  const badgeOf = v => v==="factory" ? app.orders.filter(o=>o["状態"]==="製造待ち").length : v==="pay" ? app.orders.filter(o=>o["状態"]==="入金待ち").length : v==="home" && !isLico() ? app.orders.filter(o=>o["状態"]==="お渡し・発送待ち").length : 0;
  const who = isLico() ? "LICO本部" : (app.cafeName || S.CAFES?.[app.cafeId] || "加盟店");
  $("#root").innerHTML = `
  ${DEMO?`<div class="demo-bar">見本データで表示中<a href="?demo=${DEMO==="lico"?"cafe":"lico"}">${DEMO==="lico"?"カフェ側を見る":"本部側を見る"}</a></div>`:""}
  <div class="app">
    <aside class="side" aria-label="メニュー">
      <div class="brand"><div class="brand-mark">IT</div><div><b>ITTENMON</b><small>${isLico()?"本部（フランチャイズ管理）":"加盟店 パートナー"}</small></div></div>
      ${t.map(([v,l,ic])=>`<button class="nav-btn" data-nav="${v}" ${navCur(v)}>${ic}<span>${l}</span><span class="badge" data-n="${badgeOf(v)}">${badgeOf(v)}</span></button>`).join("")}
      <div class="side-foot"><div class="who"><span class="avatar">${esc(who.slice(0,1))}</span>${esc(who)}</div><span id="updSide"></span></div>
    </aside>
    <div class="main">
      <header class="top" id="top"><div class="top-in">
        <div class="top-title"><div class="eyebrow">${esc(who)}<span id="upd"></span></div><h1 id="title">${TITLES[app.view]||""}</h1></div>
        <button class="icon-btn" id="reloadBtn" aria-label="最新の情報にする">${I.reload}</button>
      </div></header>
      <main class="content" id="view"></main>
    </div>
  </div>
  <nav class="tabbar" style="--n:${t.length}" aria-label="タブ">${t.map(([v,l,ic])=>`<button data-nav="${v}" ${navCur(v)}>${ic}<span>${l}</span><span class="badge" data-n="${badgeOf(v)}">${badgeOf(v)}</span></button>`).join("")}</nav>`;
  $("#reloadBtn").onclick = () => { reload(); if(app.view==="stats") loadStats(true); };
}
const navCur = v => (app.view===v || (v==="more" && ["stats","qr"].includes(app.view))) ? 'aria-current="page"' : "";
function go(v){ app.view = v; render(); window.scrollTo({top:0}); if(v==="stats") loadStats(); }
function render(){
  if(!app.role) return;
  shell();
  const t = app.loaded ? `${hm(app.loaded)} 更新` : "";
  $("#upd").textContent = t ? "・" + t : ""; $("#updSide").textContent = t ? "最終更新 " + hm(app.loaded) : "";
  document.title = (TITLES[app.view]||"") + " | ITTENMON Partner";
  const V = { home: isLico()?viewHqHome:viewCafeHome, orders:viewOrders, factory:viewFactory, stores:viewStores, pay:viewPay, more:viewMore, stats:viewStats, qr:viewQR }[app.view] || viewHqHome;
  $("#view").innerHTML = V();
  afterRender();
}
function afterRender(){
  if(app.view==="qr") drawQR();
  const q = $("#q"); if(q){ q.oninput = () => { app.q = q.value; $("#orderList").innerHTML = orderRows(filtered()); }; }
}

/* ============================================================
   本部（LICO）ホーム
   ============================================================ */
function viewHqHome(){
  const os = app.orders, now = new Date(), mKey = ymd(now).slice(0,7), tKey = ymd(now);
  const valid = os.filter(o=>!["キャンセル","決済待ち"].includes(o["状態"]));
  const month = valid.filter(o=>ymd(toDate(o["受付日時"])).slice(0,7)===mKey);
  const today = valid.filter(o=>ymd(toDate(o["受付日時"]))===tKey);
  const sum = a => a.reduce((s,o)=>s+Number(o["合計"]||0),0);
  const unpaid = os.filter(o=>o["状態"]==="入金待ち"), late = os.filter(isLate), queue = os.filter(o=>o["状態"]==="製造待ち"), ready = os.filter(o=>o["状態"]==="お渡し・発送待ち");
  const counts = ALL.filter(s=>s!=="キャンセル").map(s=>[s, os.filter(o=>o["状態"]===s).length]);
  const totalActive = counts.reduce((a,[,n])=>a+n,0) || 1;
  const recent = [...os].sort((a,b)=>(toDate(b["受付日時"])||0)-(toDate(a["受付日時"])||0)).slice(0,6);

function storeSummary(){
  const names = Object.values(S.CAFES||{});
  const map = {};
  const add = n => map[n] ||= { name:n, month:0, total:0, count:0, unpaid:0, unpaidN:0, ready:0, making:0, last:0 };
  ["ネットショップ", ...names].forEach(add);
  const mKey = ymd(new Date()).slice(0,7);
  app.orders.forEach(o=>{ const s = add(storeOf(o)); const st = o["状態"], amt = Number(o["合計"]||0), t = toDate(o["受付日時"]);
    if(!["キャンセル","決済待ち"].includes(st)){ s.total += amt; s.count++; if(t && ymd(t).slice(0,7)===mKey) s.month += amt; }
    if(st==="入金待ち"){ s.unpaid += amt; s.unpaidN++; } if(st==="お渡し・発送待ち") s.ready++; if(PROD.includes(st)) s.making++;
    if(t && +t > s.last) s.last = +t; });
  return Object.values(map).map((s,i)=>({...s, color: STORE_COLORS[i % STORE_COLORS.length]})).sort((a,b)=>b.month-a.month || b.total-a.total);
}

function viewStats(){
  const st = app.stats;
  if(!st) return `<button class="btn" data-nav="more" style="align-self:flex-start">← 戻る</button><div class="card card-pad" style="display:flex;flex-direction:column;gap:12px"><div class="skel" style="height:28px;width:40%"></div><div class="skel" style="height:120px"></div><div class="skel" style="height:80px"></div><span class="muted small">集計しています（10〜20秒ほどかかることがあります）</span></div>`;
  const P = [["today","今日"],["d7","7日間"],["d30","30日間"]], t = st.total[app.period];
  const pages = st.pages.filter(p=>p[app.period]>0).sort((a,b)=>b[app.period]-a[app.period]), pmax = Math.max(1,...pages.map(p=>p[app.period]));
  const f0 = (st.funnel[0]||{}).users || 0, dmax = Math.max(1,...st.daily.map(d=>d.views));
  const bar = (n,max) => `<span class="bar"><i style="width:${Math.max(2,n/max*100)}%"></i></span>`;
  return `<button class="btn" data-nav="more" style="align-self:flex-start">← 戻る</button>
  <div class="seg">${P.map(([k,l])=>`<button data-period="${k}" aria-pressed="${app.period===k}">${l}</button>`).join("")}</div>
  <section class="kpis"><div class="card kpi"><span class="k">ページ表示回数</span><span class="v num">${t.views}</span></div><div class="card kpi"><span class="k">訪問した人（端末）</span><span class="v num">${t.users}</span></div></section>
  <section><div class="sec-h"><h2>日ごとの表示回数（14日間）</h2></div><div class="card card-pad"><div class="spark">${st.daily.map(d=>`<div title="${d.date}：${d.views}回"><span class="v">${d.views||""}</span><b style="height:${Math.round(d.views/dmax*82)}%"></b><span>${+d.date.slice(8)}</span></div>`).join("")}</div></div></section>
  <div class="two"><section><div class="sec-h"><h2>注文までの進み具合（30日）</h2></div><div class="card card-pad bars">${st.funnel.map(s=>`<div class="bar-row"><span>${esc(s.step)}</span>${bar(s.users,f0||1)}<b class="num">${s.users}人${f0?` <span class="muted small">${Math.round(s.users/f0*100)}%</span>`:""}</b></div>`).join("")}</div></section>
  <section><div class="sec-h"><h2>よく見られているページ</h2></div><div class="card card-pad bars">${pages.length?pages.map(p=>`<div class="bar-row"><span>${esc(p.label)}</span>${bar(p[app.period],pmax)}<b class="num">${p[app.period]}</b></div>`).join(""):`<span class="muted">この期間の記録はまだありません</span>`}</div></section></div>
  <p class="muted small" style="margin:0">スタッフが開いた端末は数えません。名前などの個人情報は記録していません。</p>`;
}

/* ============================================================
   操作（クリック）
   ============================================================ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-nav],[data-open],[data-adv],[data-recv],[data-filter],[data-store],[data-paystore],[data-more],[data-close],[data-period],[data-clear-store],#scrim");
  if(!t) return;
  if(t.id==="scrim"){ if(e.target.id==="scrim") closeLayer(); return; }
  if(t.dataset.close!==undefined){ closeLayer(); return; }
  if(t.dataset.nav){ const [v,f] = t.dataset.nav.split(":"); if(f){ app.filter=f; app.storeSel=""; } go(v); return; }
  if(t.dataset.open){ openOrder(t.dataset.open); return; }
  if(t.dataset.filter){ app.filter = ALL.includes(t.dataset.filter) ? "st:"+t.dataset.filter : t.dataset.filter; if(app.view!=="orders") go("orders"); else render(); return; }
  if(t.dataset.store){ app.storeSel = t.dataset.store; app.filter = "all"; go("orders"); return; }
  if(t.dataset.clearStore!==undefined){ app.storeSel=""; render(); return; }
  if(t.dataset.period){ app.period = t.dataset.period; render(); return; }
  if(t.dataset.more){ ({ stats:()=>go("stats"), qr:()=>go("qr"), install:openInstall, help:openHelp, logout:logout })[t.dataset.more]?.(); return; }
  if(t.dataset.adv){ const no = t.dataset.adv, o = app.orders.find(x=>x["注文番号"]===no);
    if(!isLico() && !confirm(`${o?o["お名前"]+" 様の注文を":""}お渡し済みにしますか？`)) return;
    t.disabled = true; call("adminAdvance", no).then(r=>{ closeLayer(); apply(r); toast(isLico()?"次の工程へ進めました":"お渡し済みにしました"); }).catch(()=>{ t.disabled=false; }); return; }
  if(t.dataset.recv){ t.disabled = true; call("adminUpdate", t.dataset.recv, {"写真受領":"はい"}).then(r=>{ closeLayer(); apply(r); toast("写真の受け取りを記録しました"); }).catch(()=>{ t.disabled=false; }); return; }
  if(t.dataset.paystore){ const name = t.dataset.paystore, os = app.orders.filter(o=>o["状態"]==="入金待ち" && storeOf(o)===name), sum = os.reduce((a,o)=>a+Number(o["合計"]||0),0);
    if(!confirm(`${name} から ${yen(sum)}（${os.length}件）の入金を確認しましたか？\n確認すると製造待ちに回ります。`)) return;
    t.disabled = true; call("adminPay", os.map(o=>o["注文番号"])).then(r=>{ apply(r); toast(`${os.length}件を製造待ちに回しました`); }).catch(()=>{ t.disabled=false; }); return; }
});

document.addEventListener("change", e => { if(e.target.id==="payDay") call("adminSetPayDay", +e.target.value).then(r=>{ apply(r); toast("入金の曜日を変えました"); }).catch(()=>{}); });

function login(err){
  $("#root").innerHTML = `<div class="login"><form class="card login-card" id="lf" autocomplete="off">
    <div class="brand"><div class="brand-mark">IT</div><div><b>ITTENMON Partner</b><small>本部・加盟店の受注管理</small></div></div>
    <div><h2>パスコードを入力</h2><p class="muted small" style="margin:6px 0 0">本部のパスコードでは全店舗の注文、加盟店のパスコードではそのお店の注文が開きます。</p></div>
    <div class="otp" id="otp">${Array.from({length:6},(_,i)=>`<input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="${i+1}桁目" ${i===0?'autocomplete="one-time-code"':""}>`).join("")}</div>
    <div class="err" id="le">${esc(err||"")}</div>
    <label class="check"><input type="checkbox" id="keep" checked>この端末では次から入力しない</label>
    <button class="btn btn-primary btn-lg btn-block" type="submit" id="lb">ひらく</button>
  </form></div>`;
  const boxes = $$("#otp input"); boxes[0].focus();
  const code = () => boxes.map(b=>b.value).join("");
  boxes.forEach((b,i)=>{
    b.addEventListener("input", () => { const v = b.value.replace(/\D/g,""); if(v.length>1){ v.split("").slice(0,6-i).forEach((c,k)=>boxes[i+k].value=c); boxes[Math.min(5,i+v.length-1)].focus(); } else { b.value=v; if(v && i<5) boxes[i+1].focus(); } if(code().length===6) $("#lf").requestSubmit(); });
    b.addEventListener("keydown", e => { if(e.key==="Backspace" && !b.value && i>0){ boxes[i-1].focus(); boxes[i-1].value=""; } });
    b.addEventListener("paste", e => { const v=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6); if(v){ e.preventDefault(); v.split("").forEach((c,k)=>boxes[k].value=c); $("#lf").requestSubmit(); } });
  });
  $("#lf").onsubmit = e => { e.preventDefault(); const c = code(); if(c.length<6){ $("#le").textContent="6桁を入力してください"; return; }
    app.pass = c; $("#lb").disabled = true; $("#le").textContent = "";
    call("adminList").then(r=>{ store.set(KEY, c, $("#keep").checked); app.view="home"; apply(r); })
      .catch(err=>{ $("#lb").disabled=false; $("#le").textContent = err.message; boxes.forEach(b=>b.value=""); boxes[0].focus(); }); };
}

    const due = st==="入金待ち"||st==="決済待ち" ? "" : ymd(new Date(t + (i%5===1 ? -40 : 28)*864e5 + (i===2? -30*864e5:0)));

    return {"注文番号":`2610${pad(31-Math.floor(i/3))}-${pad(i%3+1)}`,"受付日時":t,"受付":cafe?"カフェ":"ネット","カフェ":cafe?cafes[cafe]:"","状態":st,"お名前":n,"フリガナ":"","メール":`demo${i}@example.com`,"電話":`090-0000-${pad(i)}${pad(i)}`,"受取方法":cafe?"店頭で受け取る":(i%2?"配送":"店頭で受け取る"),"郵便番号":cafe?"":"819-0161","住所":cafe||i%2===0?"":"福岡市西区今宿東1丁目",
      "注文内容":items[i%6],"数量":i%6===4?2:1,"小計":amount,"送料":0,"合計":amount,"写真":ph,"写真受領":ph&&i%5!==0?"はい":"いいえ","納期":due,"担当":i%4===0?"山下":"","メモ":"","お客様のご要望":i%4===1?"文字は少し大きめでお願いします":"","入金日時":"","更新日時":t+36e5,"支払い方法":cafe?"現金（週1振込）":"オンライン決済（カード等）","クーポン":"",items:[],folderId:"",cafeId:cafe};
  });
  demoDB = { orders, payDay:5 };
}
async function demoCall(fn, args){
  if(!demoDB) demoInit();
  await new Promise(r=>setTimeout(r, 260));
  const role = DEMO==="cafe" ? "cafe" : "lico", cid = "terrace";
  const list = () => ({ role, cafeId: role==="cafe"?cid:"", cafeName: role==="cafe"?(S.CAFES[cid]||"カフェ"):"", orders: demoDB.orders.filter(o=>role==="lico"||o.cafeId===cid), payDay: demoDB.payDay, shopUrl: SHOP_FALLBACK, sheetUrl: role==="lico"?"#":"" });
  const find = no => demoDB.orders.find(o=>o["注文番号"]===no);
  if(fn==="adminList") return list();
  if(fn==="adminAdvance"){ const o = find(args[0]); const i = FLOW.indexOf(o["状態"]); if(i<0||i===FLOW.length-1) throw new Error("この注文は次へ進められません");
    if(o["状態"]==="製造待ち" && o["写真受領"]!=="はい") throw new Error("写真を受け取ってから製作に進めてください");
    o["状態"] = FLOW[i+1]; if(FLOW[i]==="入金待ち") o["納期"] = ymd(new Date(Date.now()+30*864e5)); o["更新日時"]=Date.now(); return list(); }
  if(fn==="adminPay"){ args[0].forEach(no=>{ const o=find(no); if(o&&o["状態"]==="入金待ち"){ o["状態"]="製造待ち"; o["納期"]=ymd(new Date(Date.now()+30*864e5)); } }); return list(); }
  if(fn==="adminUpdate"){ const o=find(args[0]); Object.assign(o, args[1]); return list(); }
  if(fn==="adminSetPayDay"){ demoDB.payDay = args[0]; return list(); }
  if(fn==="adminStats"){ const d = Array.from({length:14},(_,i)=>({date: ymd(new Date(Date.now()-(13-i)*864e5)), views: 20+((i*37)%45), users: 8+((i*13)%20)}));
    return { total:{today:{views:41,users:17},d7:{views:388,users:142},d30:{views:1512,users:520}}, pages:[{label:"ホーム",today:18,d7:160,d30:610},{label:"商品ページ",today:12,d7:120,d30:480},{label:"デザイン画面",today:8,d7:70,d30:290},{label:"カート",today:3,d7:28,d30:102}],
      products:[], funnel:[{step:"商品ページを見た",users:420},{step:"デザインを始めた",users:180},{step:"カートに入れた",users:64},{step:"注文した",users:38}], daily:d, refs:[] }; }
  throw new Error("不明な操作です");
}

window.addEventListener("error", e => { if(!app.role) return; toast("画面でエラーが起きました。更新ボタンを押してください", true); console.error(e.error||e.message); });
(function start(){
  const fv = params.get("view"); if(fv && TITLES[fv]) app.view = fv;
  if(DEMO){ app.pass = "demo"; call("adminList").then(apply); return; }
  app.pass = store.get(KEY);
  if(app.pass) call("adminList").then(apply).catch(()=>login("もう一度パスコードを入力してください")); else login();
})();
const refresh = () => { if(app.role && !DEMO && !$("#layer .scrim") && Date.now()-app.loaded > 55e3) reload(); };
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") refresh(); });
setInterval(() => { if(document.visibilityState==="visible") refresh(); }, 60e3);
if("serviceWorker" in navigator && !DEMO) navigator.serviceWorker.register("sw.js").catch(()=>{});
