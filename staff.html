<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta charset="utf-8">
<title>ITTENMON 受注管理</title>
<link rel="manifest" href="staff.webmanifest">
<meta name="theme-color" content="#1f5a52">
<link rel="apple-touch-icon" href="img/app/staff-180.png">
<link rel="icon" href="img/app/staff-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="受注管理">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f7f8f7;--surface:#fff;--line:#dfe3e1;--fg:#1d2624;--sub:#66716e;--ink:#1f5a52;--ink-soft:#e4efec;
  --warn:#a35a00;--warn-soft:#fbefdc;--late:#b3261e;--late-soft:#fbe4e2;--r:10px;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;--f-num:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 80px;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:20px;margin:0}
.top h1 small{display:block;font-size:12px;color:var(--sub);font-weight:400}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500;text-decoration:none;color:inherit;display:inline-block}
.btn-main{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:12px;color:var(--sub);display:block}
.stat .v{font-family:var(--f-num);font-size:24px}
.stat.warn .v{color:var(--warn)} .stat.late .v{color:var(--late)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--ink)}
.tab .cnt{font-family:var(--f-num);font-size:12px;margin-left:6px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 7px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{font-family:var(--f-num);margin-left:6px;opacity:.8}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.late{border-color:var(--late)}
.card-h{display:flex;justify-content:space-between;gap:8px}
.who{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.no{font-family:var(--f-num);font-size:12px;color:var(--sub)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:4px;padding:1px 8px;background:var(--ink-soft);color:var(--ink);white-space:nowrap}
.tag.cafe{background:var(--fg);color:#fff}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.late{background:var(--late-soft);color:var(--late)}
.items{margin:0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:4px}
.items li{overflow-wrap:anywhere}
.photos{display:flex;gap:6px;flex-wrap:wrap}
.photos a img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);gap:8px;flex-wrap:wrap}
.acts{display:flex;gap:8px}
.go{flex:1;padding:11px 12px;border-radius:8px;border:0;background:var(--ink);color:#fff;font-weight:700}
.go:disabled{background:var(--line);color:var(--sub);cursor:not-allowed}
.edit{padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:none}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;color:var(--sub);text-align:center}
.paybar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warn-soft);border-radius:var(--r);padding:12px 16px}
.payrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.payrow-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input,.search select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;flex:1 1 160px;min-width:0}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:720px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--sub);font-weight:500}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;overflow-y:auto;z-index:20}
.sheet{background:var(--surface);border-radius:14px;width:min(620px,100%);padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:18px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--sub)} .kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--sub)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.sheet-a{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.login{max-width:360px;margin:15vh auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login input{border:1px solid var(--line);border-radius:8px;padding:12px;font-size:20px;letter-spacing:.3em;text-align:center}
.err{color:var(--late);font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:30}
.loading .wrap{opacity:.6;pointer-events:none}
.loading .bnav,.loading .appbar{pointer-events:none}

/* ===== アプリ表示（スマホ） ===== */
.appbar{position:sticky;top:0;z-index:15;background:rgba(247,248,247,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.appbar h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar h1 small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn svg{width:20px;height:20px}
.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.updated{font-size:11px;color:var(--sub)}
.desk-acts{display:none;gap:8px;flex-wrap:wrap}
@media(min-width:900px){.desk-acts{display:flex}}
.summary{display:flex;overflow-x:auto;gap:10px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.summary::-webkit-scrollbar{display:none}
.stat{flex:1 0 128px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);position:relative}
.bnav svg{width:23px;height:23px}
.bnav button[aria-selected="true"]{color:var(--ink);font-weight:700}
.bnav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--warn);color:#fff;font-family:var(--f-num);font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bnav .badge[data-n="0"]{display:none}
@media(min-width:900px){.bnav{position:static;grid-template-columns:repeat(4,max-content);gap:4px;background:none;border:0;border-bottom:1px solid var(--line);backdrop-filter:none;padding:0}
  .bnav button{flex-direction:row;font-size:15px;padding:10px 14px;border-bottom:2px solid transparent;gap:6px}
  .bnav button[aria-selected="true"]{border-color:var(--ink)} .bnav svg{width:18px;height:18px} .bnav .badge{position:static}}
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px}
@media(max-width:600px){.list{grid-template-columns:1fr}}
.photos{gap:8px}
.photos a{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--sub);text-decoration:none;align-items:center;width:72px}
.photos a img{width:72px;height:72px}
.photos a.look img{border:2px solid var(--ink)}
.photos a.look{color:var(--ink);font-weight:700}
/* すべての注文：スマホではカード状に */
@media(max-width:700px){
  .tbl{background:none;border:0;overflow:visible}
  table{min-width:0} thead{display:none}
  tbody{display:flex;flex-direction:column;gap:8px}
  tr.click{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
  tr.click td{border:0;padding:0;white-space:normal;font-size:13px;color:var(--sub)}
  tr.click td.c-name{font-size:15px;color:var(--fg);font-weight:700;grid-column:1}
  tr.click td.c-total{grid-column:2;grid-row:1;color:var(--fg)}
  tr.click td.c-hide{display:none}
  tr.click td.c-st{grid-column:2;text-align:right;color:var(--ink);font-weight:700}
}
/* メニュー・QR */
.menu{display:flex;flex-direction:column;gap:4px}
.menu a,.menu button{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:10px;border:0;background:none;text-decoration:none;color:inherit;font-size:15px;text-align:left;width:100%}
.menu a:hover,.menu button:hover{background:var(--bg)}
.menu svg{width:20px;height:20px;color:var(--ink);flex-shrink:0}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.qr-card{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;break-inside:avoid}
.qr-card .qr{width:180px;height:180px}
.qr-card .qr img,.qr-card .qr canvas{width:180px!important;height:180px!important}
.qr-card b{font-size:16px}
.qr-card small{color:var(--sub);font-size:11px;word-break:break-all}
.install-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.remember{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub)}
@media print{.appbar,.bnav,.wrap,.sheet-a,.no-print{display:none!important}.overlay{position:static;background:none;padding:0}.sheet{width:100%;box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="js/config.js?v=1017a"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<div id="sheetHost"></div>
<div id="toastHost"></div>
<script>window.onerror=function(m,src,l,c){var d=document.createElement("pre");d.style.cssText="color:#b3261e;white-space:pre-wrap;padding:16px";d.textContent="画面の読み込みでエラーが起きました: "+m+"（"+l+"行目）";document.body.prepend(d);};</script>
<script>
const PAGE = "auto";   // "lico"＝製造管理／"cafe"＝カフェ受付確認／"auto"＝スタッフ共通の入口（パスコードで自動判定）
let ROLE = PAGE, CAFE = false, TITLE = "";
function setRole(r){ ROLE = r; CAFE = r === "cafe"; TITLE = r === "auto" ? "ITTENMON 受注管理" : (CAFE ? "カフェ 受注管理" : "受注管理（LICO・全店）"); }
setRole(PAGE);
const NL = String.fromCharCode(10);   // 改行（Googleの表示の仕組みが記号を書き換えるため、記号を使わずに書く）
const FLOW = ["入金待ち","製造待ち","製作中","検品・梱包","お渡し・発送待ち","完了"];
const ACTION = {"入金待ち":"入金を確認した","製造待ち":"製作を始める","製作中":"できあがった → 検品へ","検品・梱包":"検品OK"};
const ALL = ["決済待ち",...FLOW,"キャンセル"];
const WD = ["日","月","火","水","木","金","土"];
let pass = "", orders = [], payDay = 5, shopUrl = "", sheetUrl = "", cafeId = "", cafeName = "", view = "board", stageSel = "製造待ち";
const $ = s => document.querySelector(s);
const yen = n => "¥" + (Number(n)||0).toLocaleString("ja-JP");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const md = s => { if(!s) return "—"; const d = typeof s==="number" ? new Date(s) : new Date(String(s).slice(0,10)+"T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };
const dueStr = o => typeof o["納期"]==="number" ? ymd(new Date(o["納期"])) : String(o["納期"]||"").slice(0,10);
const daysLeft = o => { const s=dueStr(o); return s ? Math.round((new Date(s+"T00:00:00") - new Date(ymd(new Date())+"T00:00:00"))/864e5) : null; };
const active = o => !["完了","キャンセル","決済待ち"].includes(o["状態"]);
const isLate = o => active(o) && dueStr(o) && daysLeft(o) < 0;
const isSoon = o => active(o) && dueStr(o) && daysLeft(o) >= 0 && daysLeft(o) <= 2;
const photoList = o => String(o["写真"]||"").split(NL).map((line,i)=>{ const id=(line.match(new RegExp("/d/([^/]+)"))||[])[1]; const label=line.split(" http")[0]; return id ? { id, label: label && !label.startsWith("http") ? label : "画像"+(i+1) } : null; }).filter(Boolean);
const photoIds = o => photoList(o).map(p=>p.id);
const thumbs = o => { const ps=photoList(o); return ps.length ? `<div class="photos">${ps.map(p=>`<a class="${p.label.includes("完成イメージ")?"look":""}" href="https://drive.google.com/file/d/${p.id}/view" target="_blank" rel="noopener"><img src="https://drive.google.com/thumbnail?id=${p.id}&sz=w200" alt="${esc(p.label)}" loading="lazy"><span>${esc(p.label.replace("印刷用データ","印刷用"))}</span></a>`).join("")}</div>` : ""; };
const store = { get(k){ try{ return localStorage.getItem(k)||sessionStorage.getItem(k)||""; }catch(_){ return ""; } }, set(k,v,keep){ try{ (keep?localStorage:sessionStorage).setItem(k,v); }catch(_){} }, del(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(_){} } };
const ICON = {
  board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>',
  pay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/></svg>',
  all:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',
  reload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
  shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 7h14l-1.5 13h-11z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',
  sheet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>',
  qr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M18 18h3v3"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>'
};

function toast(m){ $("#toastHost").innerHTML=`<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>$("#toastHost").innerHTML="",2200); }
// Googleの注文の仕組みに問い合わせる（パスコード必須）
async function call(fn, ...args){
  document.body.classList.add("loading"); const rb=document.getElementById("reload"); if(rb) rb.classList.add("spin");
  try{
    const res = await fetch(window.LICO_SHOP.GAS_URL, {method:"POST", body: JSON.stringify({action:"admin", fn, pass, args})});
    const j = await res.json();
    if(!j.ok) throw new Error(j.error || "うまくいきませんでした");
    return j.data;
  }catch(e){ toast(e.message || String(e)); throw e; }
  finally{ document.body.classList.remove("loading"); document.querySelectorAll(".spin").forEach(x=>x.classList.remove("spin")); }
}
let lastLoad = 0;
function apply(r){ lastLoad=Date.now(); orders=r.orders; payDay=r.payDay; shopUrl=r.shopUrl||shopUrl; sheetUrl=r.sheetUrl||""; cafeId=r.cafeId||""; cafeName=r.cafeName||""; render(); }

/* ログイン */
function login(){
  $("#app").innerHTML = `<form class="login" id="lf"><h1 style="font-size:18px;margin:0">${TITLE}</h1>
    <label for="pw" style="font-size:13px;color:var(--sub)">${ROLE==="auto"?"":CAFE?"カフェ用":"LICO用"}パスコード（6桁）</label>
    <input id="pw" inputmode="numeric" autocomplete="off" maxlength="6"><div class="err" id="le"></div>
    <label class="remember"><input type="checkbox" id="keep" checked> この端末ではパスコードを覚えておく（次からすぐ開けます）</label>
    <button class="btn btn-main" type="submit">開く</button>
    <p style="margin:0;font-size:12px;color:var(--sub)">LICOのパスコードではすべてのカフェ・ネットの注文が、カフェのパスコードではそのカフェで受けた注文だけが表示されます。</p></form>`;
  $("#pw").focus();
  $("#lf").onsubmit = e => { e.preventDefault(); pass=$("#pw").value.trim();
    call("adminList").then(r=>{ store.set("lico-pass-"+PAGE, pass, $("#keep").checked); setRole(r.role); shell(); apply(r); })
      .catch(err=>{ $("#le").textContent=err.message; }); };
}

function shell(){
  const tabs = [["board",CAFE?"受付状況":"製造ボード"],["pay",CAFE?"お振込み":"入金チェック"],["all","すべて"],["menu","メニュー"]];
  $("#app").innerHTML = `<header class="appbar"><h1>${TITLE}<small id="sub">${CAFE?"このカフェで受けた注文":"ネット・全カフェの注文"}</small></h1>
      <span class="updated" id="upd"></span>
      <div class="desk-acts"><a class="btn" id="shopLink" target="_blank" rel="noopener">お客様の注文画面</a><a class="btn" id="sheetLink" target="_blank" rel="noopener">注文データ</a><a class="btn btn-main" id="cafeLink">＋ 注文を受け付ける</a></div>
      <button class="icon-btn" id="reload" aria-label="最新にする">${ICON.reload}</button></header>
    <div class="wrap">
    <nav class="bnav" role="tablist">${tabs.map(([v,l])=>`<button role="tab" id="t-${v}">${ICON[v]}<span>${l}</span>${v==="pay"?`<span class="badge" id="payCnt" data-n="0">0</span>`:""}</button>`).join("")}</nav>
    <section class="summary" id="summary"></section>
    <section id="v-board"><div class="chips" id="chips" style="margin-bottom:12px"></div><div class="list" id="cards"></div></section>
    <section id="v-pay" hidden><div class="paybar" style="margin-bottom:12px"><span>${CAFE?"カフェで受け付けた分は<b id='pd'></b>にまとめてLICOへお振込みください（現金でお受け取りした分だけ。カード払いの注文はふくみません）。お振込みを確認した日から1か月で納品します。":"カフェ受付分は<b id='pd'></b>にまとめて入金。確認した日から1か月後が納期になります。"}</span>
      <select id="paySel" aria-label="入金日" ${CAFE?"hidden":""}>${WD.map((w,i)=>`<option value="${i}">毎週${w}曜</option>`).join("")}</select></div><div id="payList" style="display:flex;flex-direction:column;gap:10px"></div></section>
    <section id="v-all" hidden><div class="search" style="margin-bottom:12px"><input id="q" type="search" placeholder="お名前・注文番号・機種・カフェ名で探す">
      <select id="fs"><option value="">すべての状態</option>${ALL.map(s=>`<option>${s}</option>`).join("")}</select></div>
      <div class="tbl"><table><thead><tr><th>注文番号</th><th>受付日</th><th>受付</th><th>カフェ</th><th>お名前</th><th>数量</th><th>合計</th><th>納期</th><th>状態</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </div>`;
  $("#reload").onclick = ()=>call("adminList").then(apply);
  ["board","pay","all"].forEach(v=>$("#t-"+v).onclick=()=>{ view=v; render(); window.scrollTo(0,0); });
  $("#t-menu").onclick = openMenu;
  $("#paySel").onchange = e => call("adminSetPayDay", +e.target.value).then(r=>{ apply(r); toast("入金日を変更しました"); });
  $("#q").oninput = renderAll; $("#fs").onchange = renderAll;
}
function logout(){ store.del("lico-pass-"+PAGE); pass=""; setRole(PAGE); $("#sheetHost").innerHTML=""; login(); }
const cafeOrderUrl = id => (shopUrl||"") + "product.html?mode=cafe&cafe=" + encodeURIComponent(id);
function openMenu(){
  const items = [
    CAFE ? `<a href="${esc(cafeOrderUrl(cafeId))}">${ICON.plus}注文を受け付ける（受付画面）</a>` : `<a href="${esc((shopUrl||"")+"product.html")}" target="_blank" rel="noopener">${ICON.shop}お客様の注文画面</a>`,
    `<button type="button" id="m-qr">${ICON.qr}${CAFE?"お客様用のQRコード（印刷）":"QRコード（ネットショップ・各カフェ）"}</button>`,
    !CAFE && sheetUrl ? `<a href="${esc(sheetUrl)}" target="_blank" rel="noopener">${ICON.sheet}注文データ（スプレッドシート）</a>` : "",
    `<button type="button" id="m-inst">${ICON.phone}このアプリをホーム画面に追加</button>`,
    `<button type="button" id="m-out">${ICON.out}ログアウト</button>`];
  $("#sheetHost").innerHTML = `<div class="overlay" id="ov"><div class="sheet"><h2>メニュー</h2><nav class="menu">${items.join("")}</nav><div class="sheet-a"><button class="btn" type="button" id="dc">閉じる</button></div></div></div>`;
  $("#ov").onclick = e => { if(e.target.id==="ov"||e.target.id==="dc") $("#sheetHost").innerHTML=""; };
  $("#m-qr").onclick = openQR; $("#m-inst").onclick = openInstall; $("#m-out").onclick = logout;
}
/* お客様に読み込んでもらうQRコード。カフェのQRから注文すると、そのカフェの注文として記録される */
function openQR(){
  const names = (window.LICO_SHOP||{}).CAFES || {};
  const list = CAFE ? [[names[cafeId]||cafeName||"このカフェ", cafeOrderUrl(cafeId), "このカフェでのご注文（店頭受け取り）"]]
    : [["ITTENMON ネットショップ", shopUrl||"", "ネット注文（配送・店頭受け取り）"]].concat(Object.keys(names).map(id=>[names[id], cafeOrderUrl(id), "カフェでのご注文"]));
  $("#sheetHost").innerHTML = `<div class="overlay" id="ov"><div class="sheet" style="width:min(820px,100%)"><h2>QRコード</h2>
    <p class="no-print" style="margin:0;font-size:13px;color:var(--sub)">お客様がスマホのカメラで読み込むと、注文画面が開きます。カフェのQRから入った注文は、そのカフェの注文として記録されます。「印刷する」でPOPに使えます。</p>
    <div class="qr-grid">${list.map(([n,u,d],i)=>`<div class="qr-card"><b>${esc(n)}</b><span style="font-size:12px">${esc(d)}</span><div class="qr" id="qr${i}"></div><span style="font-size:13px">スマホのカメラで読み取って<br>写真でオリジナルグッズをつくろう</span><small>${esc(u)}</small></div>`).join("")}</div>
    ${!CAFE&&!Object.keys(names).length?`<p style="font-size:13px;color:var(--sub)">カフェのQRを出すには js/config.js の CAFES にカフェIDと名前を書いてください。</p>`:""}
    <div class="sheet-a no-print"><button class="btn" type="button" id="dc">閉じる</button><button class="btn btn-main" type="button" id="qp">印刷する</button></div></div></div>`;
  $("#ov").onclick = e => { if(e.target.id==="ov"||e.target.id==="dc") $("#sheetHost").innerHTML=""; };
  $("#qp").onclick = () => window.print();
  const make = () => list.forEach(([,u],i)=>{ new QRCode(document.getElementById("qr"+i), { text:u, width:360, height:360, correctLevel: QRCode.CorrectLevel.M }); });
  if(window.QRCode) make(); else { const t=setInterval(()=>{ if(window.QRCode){ clearInterval(t); make(); } },200); }
}
/* ホーム画面に追加（Androidはそのまま追加、iPhoneは手順を案内） */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; });
function openInstall(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; }); $("#sheetHost").innerHTML=""; return; }
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  $("#sheetHost").innerHTML = `<div class="overlay" id="ov"><div class="sheet"><h2>ホーム画面に追加</h2>
    ${standalone ? `<p style="margin:0">すでにアプリとして開いています。</p>` : ios ? `<ol class="install-steps"><li>Safariでこのページを開きます</li><li>画面下の <b>共有ボタン</b>（四角から矢印が出ているマーク）を押します</li><li><b>「ホーム画面に追加」</b>を選んで「追加」を押します</li></ol><p style="margin:0;font-size:13px;color:var(--sub)">ホーム画面の「受注管理」アイコンから、アプリのように開けます。</p>`
      : `<ol class="install-steps"><li>Chromeの右上の <b>︙</b> を押します</li><li><b>「ホーム画面に追加」</b>または<b>「アプリをインストール」</b>を選びます</li></ol>`}
    <div class="sheet-a"><button class="btn" type="button" id="dc">閉じる</button></div></div></div>`;
  $("#ov").onclick = e => { if(e.target.id==="ov"||e.target.id==="dc") $("#sheetHost").innerHTML=""; };
}

function render(){
  $("#cafeLink").hidden = !CAFE; $("#cafeLink").href = cafeOrderUrl(cafeId);
  $("#shopLink").hidden = CAFE; $("#shopLink").href = (shopUrl||"") + "product.html";
  $("#sheetLink").hidden = CAFE || !sheetUrl; $("#sheetLink").href = sheetUrl;
  if(CAFE && cafeName){ $(".appbar h1").firstChild.textContent = cafeName + " 受注管理"; document.title = cafeName + " 受注管理"; }
  const d=new Date(lastLoad); $("#upd").textContent = lastLoad ? `${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")} 更新` : "";
  ["board","pay","all"].forEach(v=>{ $("#v-"+v).hidden = v!==view; $("#t-"+v).setAttribute("aria-selected", v===view); });
  const unpaid = orders.filter(o=>o["状態"]==="入金待ち");
  const late = orders.filter(isLate).length;
  $("#summary").innerHTML = (CAFE ? [["お振込みが必要",unpaid.length,unpaid.length?"warn":""],["LICOで製作中",orders.filter(o=>["製造待ち","製作中","検品・梱包"].includes(o["状態"])).length,""],["お渡しできます",orders.filter(o=>o["状態"]==="お渡し・発送待ち").length,""],["お渡し済み",orders.filter(o=>o["状態"]==="完了").length,""]] : [["入金待ち（カフェ）",unpaid.length,unpaid.length?"warn":""],["製造待ち",orders.filter(o=>o["状態"]==="製造待ち").length,""],
    ["製作・検品中",orders.filter(o=>["製作中","検品・梱包"].includes(o["状態"])).length,""],["お渡し・発送待ち",orders.filter(o=>o["状態"]==="お渡し・発送待ち").length,""],
    ["納期を過ぎている",late,late?"late":""]]).map(([k,v,c])=>`<div class="stat ${c}"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");
  $("#payCnt").textContent = unpaid.length; $("#payCnt").dataset.n = unpaid.length; $("#pd").textContent = `毎週${WD[payDay]}曜`; $("#paySel").value = payDay;
  if(view==="board") renderBoard(); else if(view==="pay") renderPay(); else renderAll();
}

function renderBoard(){
  const cnt = s => orders.filter(o=>o["状態"]===s).length;
  $("#chips").innerHTML = FLOW.map(s=>`<button class="chip" data-stage="${s}" aria-pressed="${s===stageSel}">${s}<span class="n">${cnt(s)}</span></button>`).join("");
  let list = orders.filter(o=>o["状態"]===stageSel);
  list.sort(stageSel==="完了" ? (a,b)=>(b["更新日時"]||0)-(a["更新日時"]||0) : (a,b)=>dueStr(a).localeCompare(dueStr(b)));
  if(stageSel==="完了") list = list.slice(0,60);
  $("#cards").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">「${stageSel}」の注文はありません。</div>`;
}

function card(o){
  const s=o["状態"], noPhoto = o["写真受領"]!=="はい";
  const pay = o["支払い方法"] || (o["受付"]==="カフェ"?"現金（週1振込）":"カード");
  const tags = [o["受付"]==="カフェ"?`<span class="tag cafe">${esc(o["カフェ"]||"カフェ")}</span>`:`<span class="tag">ネット</span>`, `<span class="tag">${pay.includes("現金")?"現金（週1振込）":pay.includes("クーポン")?esc(pay):(s==="決済待ち"?"カード払い（まだ払われていない）":"カード払い済み")}</span>`, `<span class="tag">${esc(o["受取方法"])}</span>`,
    s!=="入金待ち"&&s!=="完了"&&noPhoto?`<span class="tag warn">写真なし</span>`:"",
    isLate(o)?`<span class="tag late">納期超過</span>`:isSoon(o)?`<span class="tag warn">納期まで${daysLeft(o)}日</span>`:""].join("");
  let btn = "";
  if(CAFE){ btn = s==="お渡し・発送待ち" ? `<button class="go" data-next="${esc(o["注文番号"])}">お客様に渡した</button>` : `<span class="tag" style="align-self:center">${esc(s==="入金待ち"?"お振込みが必要":s==="決済待ち"?"カード払い待ち":["製造待ち","製作中","検品・梱包"].includes(s)?"LICOで製作中":s)}</span>`; }
  else if(s==="製造待ち" && noPhoto) btn = `<button class="go" data-recv="${esc(o["注文番号"])}">写真を受け取った</button>`;
  else if(s==="お渡し・発送待ち") btn = `<button class="go" data-next="${esc(o["注文番号"])}">${o["受取方法"]==="配送"?"発送した":o["受付"]==="カフェ"?"カフェでお渡し済み":"お渡しした"}</button>`;
  else if(ACTION[s]) btn = `<button class="go" data-next="${esc(o["注文番号"])}">${ACTION[s]}</button>`;
  return `<article class="card ${isLate(o)?"late":""}">
    <div class="card-h"><div><div class="who">${esc(o["お名前"])} 様</div><div class="no">${esc(o["注文番号"])}｜${md(o["受付日時"])}受付${o["担当"]?`｜担当 ${esc(o["担当"])}`:""}</div></div><div class="num">${yen(o["合計"])}</div></div>
    <div class="tags">${tags}</div>
    <ul class="items">${String(o["注文内容"]||"").split(NL).map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
    ${thumbs(o)}
    <div class="meta"><span>納期 ${dueStr(o)?md(dueStr(o)):"入金確認から1か月"}</span><span>${esc(o["電話"])}</span></div>
    <div class="acts">${btn}<button class="edit" data-edit="${esc(o["注文番号"])}">詳細</button></div>
  </article>`;
}

function renderPay(){
  const g = {};
  orders.filter(o=>o["状態"]==="入金待ち").forEach(o=>{ const k = CAFE ? o["お名前"]+"｜"+o["電話"] : (o["カフェ"]||"カフェ"); (g[k] ||= []).push(o); });
  const keys = Object.keys(g).sort();
  $("#payList").innerHTML = keys.length ? keys.map(k=>{ const os=g[k], sum=os.reduce((a,o)=>a+Number(o["合計"]||0),0);
    return `<div class="payrow"><div class="payrow-h"><div><div class="who">${CAFE?esc(os[0]["お名前"])+" 様":esc(k)}</div><div class="no">${CAFE?esc(os[0]["電話"]):os.length+"件の注文"}</div></div><div class="num" style="font-size:18px">${yen(sum)}</div></div>
      <ul class="items">${os.map(o=>`<li>${esc(o["注文番号"])}｜${esc(o["お名前"])} 様｜${o["数量"]}個｜${yen(o["合計"])}</li>`).join("")}</ul>
      ${CAFE?"":`<div class="acts"><button class="go" data-pay="${esc(os.map(o=>o["注文番号"]).join(","))}">${os.length}件 ${yen(sum)} の入金を確認した</button></div>`}</div>`; }).join("") + (CAFE&&keys.length?`<div class="paybar"><span>今週お振込みいただく合計</span><b class="num">${yen(orders.filter(o=>o["状態"]==="入金待ち").reduce((a,o)=>a+Number(o["合計"]||0),0))}</b></div>`:"")
    : `<div class="empty">${CAFE?"お振込みが必要な注文はありません。":"入金待ちの注文はありません。"}</div>`;
}

function renderAll(){
  const q=($("#q").value||"").trim().toLowerCase(), fs=$("#fs").value;
  const list = orders.filter(o=>(!fs||o["状態"]===fs)&&(!q||[o["注文番号"],o["お名前"],o["フリガナ"],o["注文内容"],o["電話"],o["カフェ"]].join(" ").toLowerCase().includes(q))).sort((a,b)=>b["受付日時"]-a["受付日時"]);
  $("#rows").innerHTML = list.length ? list.slice(0,300).map(o=>`<tr class="click" data-edit="${esc(o["注文番号"])}"><td class="num">${esc(o["注文番号"])}</td><td>${md(o["受付日時"])}受付</td><td class="c-hide">${esc(o["受付"])}・${esc(o["支払い方法"]||(o["受付"]==="カフェ"?"現金（週1振込）":"カード"))}</td><td>${esc(o["カフェ"])||"ネット"}</td><td class="c-name">${esc(o["お名前"])} 様</td><td class="c-hide">${o["数量"]}</td><td class="num c-total">${yen(o["合計"])}</td><td>納期 ${md(dueStr(o))}</td><td class="c-st">${esc(o["状態"])}</td></tr>`).join("")
    : `<tr><td colspan="9" style="color:var(--sub)">条件に合う注文はありません。</td></tr>`;
}

function openDetail(no){
  const o = orders.find(x=>x["注文番号"]===no); if(!o) return;
  $("#sheetHost").innerHTML = `<div class="overlay" id="ov"><form class="sheet" id="df">
    <h2>注文 ${esc(no)}</h2>
    <dl class="kv">${o["カフェ"]?`<dt>受付カフェ</dt><dd>${esc(o["カフェ"])}</dd>`:""}<dt>お名前</dt><dd>${esc(o["お名前"])}（${esc(o["フリガナ"])}）</dd><dt>電話</dt><dd>${esc(o["電話"])}</dd><dt>メール</dt><dd>${esc(o["メール"])||"—"}</dd>
      <dt>受け取り</dt><dd>${esc(o["受取方法"])}${o["住所"]?`${NL}〒${esc(o["郵便番号"])} ${esc(o["住所"])}`:""}</dd><dt>注文内容</dt><dd>${esc(o["注文内容"])}</dd>
      <dt>金額</dt><dd>${yen(o["小計"])}＋送料${yen(o["送料"])}＝${yen(o["合計"])}</dd><dt>ご要望</dt><dd>${esc(o["お客様のご要望"])||"—"}</dd>
      <dt>画像</dt><dd>${photoList(o).length?thumbs(o):"なし"}${o.folderId?`<a href="https://drive.google.com/drive/folders/${o.folderId}" target="_blank" rel="noopener">この注文のフォルダを開く</a>`:""}</dd></dl>
    ${CAFE?`<p style="margin:0">状態：<b>${esc(o["状態"])}</b>　納期：${dueStr(o)?md(dueStr(o)):"お振込みの確認から1か月"}</p><div class="sheet-a"><button class="btn" type="button" id="dc">閉じる</button></div></form></div>`:`<div class="grid2"><div class="f"><label for="d-st">状態</label><select id="d-st">${ALL.map(s=>`<option ${s===o["状態"]?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="f"><label for="d-due">納期</label><input type="date" id="d-due" value="${esc(dueStr(o))}"></div></div>
    <div class="grid2"><div class="f"><label for="d-as">担当</label><input id="d-as" value="${esc(o["担当"])}"></div>
      <div class="f"><label for="d-ph">写真の受け取り</label><select id="d-ph"><option ${o["写真受領"]==="はい"?"selected":""}>はい</option><option ${o["写真受領"]!=="はい"?"selected":""}>いいえ</option></select></div></div>
    <div class="f"><label for="d-memo">メモ</label><textarea id="d-memo" rows="2">${esc(o["メモ"])}</textarea></div>
    <div class="sheet-a"><button class="btn" type="button" id="dc">閉じる</button><button class="btn btn-main" type="submit">保存する</button></div>
  </form></div>`}`;
  $("#ov").onclick = e => { if(e.target.id==="ov"||e.target.id==="dc") $("#sheetHost").innerHTML=""; };
  if(!CAFE) $("#df").onsubmit = e => { e.preventDefault();
    call("adminUpdate", no, {"状態":$("#d-st").value,"納期":$("#d-due").value,"担当":$("#d-as").value.trim(),"写真受領":$("#d-ph").value,"メモ":$("#d-memo").value})
      .then(r=>{ apply(r); $("#sheetHost").innerHTML=""; toast("保存しました"); }); };
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-stage],[data-next],[data-recv],[data-pay],[data-edit]"); if(!t || t.closest("#sheetHost")) return;
  if(t.dataset.stage){ stageSel=t.dataset.stage; render(); }
  else if(t.dataset.next){ t.disabled=true; call("adminAdvance", t.dataset.next).then(r=>{ apply(r); toast("次の工程へ進めました"); }).catch(()=>t.disabled=false); }
  else if(t.dataset.recv){ t.disabled=true; call("adminUpdate", t.dataset.recv, {"写真受領":"はい"}).then(r=>{ apply(r); toast("写真の受け取りを記録しました"); }); }
  else if(t.dataset.pay){ t.disabled=true; call("adminPay", t.dataset.pay.split(",")).then(r=>{ apply(r); toast("製造待ちに回しました"); }); }
  else if(t.dataset.edit){ openDetail(t.dataset.edit); }
});

document.title = TITLE;
pass = store.get("lico-pass-"+PAGE);
if(pass){ call("adminList").then(r=>{ setRole(r.role); shell(); apply(r); }).catch(()=>login()); } else login();
// アプリに戻ってきたとき・開いている間は1分ごとに最新にする
const refresh = () => { if(pass && document.getElementById("reload") && !document.querySelector("#sheetHost .overlay") && Date.now()-lastLoad > 55e3) call("adminList").then(apply).catch(()=>{}); };
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") refresh(); });
setInterval(() => { if(document.visibilityState==="visible") refresh(); }, 60e3);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
